<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบหารค่าใช้จ่ายทริปเพื่อน & บันทึกประวัติ (Cloud)</title>
  
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel CDN for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <!-- เพิ่ม Storage สำหรับอัพโหลดใบเสร็จ -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    // ----------------------------------------------------
    // Firebase Configuration
    // ----------------------------------------------------
    const firebaseConfig = {
      apiKey: "AIzaSyCwvoRRmlGk6C-S2PbsZbkm2P5B2E98Hks",
      authDomain: "trip-expense-calculator-9261b.firebaseapp.com",
      projectId: "trip-expense-calculator-9261b",
      storageBucket: "trip-expense-calculator-9261b.firebasestorage.app",
      messagingSenderId: "211000271288",
      appId: "1:211000271288:web:e76cc31d65834a09db6f4d",
      measurementId: "G-N4DE2DLX4W"
    };

    // Initialize Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();
    const storage = firebase.storage();

    const { useState, useMemo, useEffect, useRef } = React;

    const Icon = ({ name, className = "w-4 h-4" }) => {
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [name]);
      return <i data-lucide={name} className={className}></i>;
    };

    const POPULAR_CATEGORIES = [
      { label: "🍲 ค่าอาหาร", title: "ค่าอาหาร" },
      { label: "🍻 ค่าเครื่องดื่ม/เบียร์", title: "ค่าเครื่องดื่ม/เบียร์" },
      { label: "🚗 ค่าน้ำมัน/ค่ารถ", title: "ค่าน้ำมัน/ค่าเดินทาง" },
      { label: "🏨 ค่าที่พัก/โรงแรม", title: "ค่าที่พัก" },
      { label: "☕ ค่าคาเฟ่/ของว่าง", title: "ค่ากาแฟ/ขนม" },
      { label: "🎫 ค่าบัตร/ค่าเข้าชม", title: "ค่าตั๋ว/กิจกรรม" },
      { label: "🛒 ของใช้ส่วนกลาง", title: "ของใช้ส่วนกลาง" }
    ];

    const getTodayDateString = () => new Date().toISOString().split('T')[0];

    function App() {
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);

      const getDefaultTripName = () => {
        const today = new Date();
        return `ทริปวันที่ ${today.toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' })}`;
      };

      const [currentTripId, setCurrentTripId] = useState(null); 
      const [tripName, setTripName] = useState(getDefaultTripName());

      const [friends, setFriends] = useState([]);
      const [expenses, setExpenses] = useState([]);
      const [history, setHistory] = useState([]);

      // Inputs state: Friends
      const [newFriendName, setNewFriendName] = useState('');
      const [newFriendPromptPay, setNewFriendPromptPay] = useState('');
      const [newFriendHeadcount, setNewFriendHeadcount] = useState(1);
      
      // Inputs state: Expenses
      const [expenseDate, setExpenseDate] = useState(getTodayDateString());
      const [expenseTitle, setExpenseTitle] = useState('');
      const [expenseAmount, setExpenseAmount] = useState('');
      const [expensePayerId, setExpensePayerId] = useState('');
      const [selectedParticipants, setSelectedParticipants] = useState([]);
      const [receiptFile, setReceiptFile] = useState(null);
      const [uploading, setUploading] = useState(false);
      const fileInputRef = useRef(null);
      
      // UI States
      const [copied, setCopied] = useState(false);
      const [showResetModal, setShowResetModal] = useState(false);
      const [showHistoryModal, setShowHistoryModal] = useState(false);
      const [saving, setSaving] = useState(false);
      const [alertMsg, setAlertMsg] = useState(null);

      const showAlert = (message, type = 'info') => {
        setAlertMsg({ message, type });
        setTimeout(() => setAlertMsg(null), 4000);
      };

      useEffect(() => {
        let unsubscribeHistory = null;
        const unsubscribeAuth = auth.onAuthStateChanged((currentUser) => {
          setUser(currentUser);
          setLoading(false);

          if (unsubscribeHistory) {
            unsubscribeHistory();
            unsubscribeHistory = null;
          }

          if (currentUser) {
            const historyRef = db.collection("users").doc(currentUser.uid).collection("trips");
            unsubscribeHistory = historyRef.orderBy("createdAt", "desc").onSnapshot((snapshot) => {
              const tripsData = snapshot.docs.map(doc => ({
                id: doc.id,
                ...doc.data()
              }));
              setHistory(tripsData);
            }, (error) => {
              if (auth.currentUser) {
                console.error("Firestore error:", error);
                showAlert("ไม่สามารถดึงข้อมูลประวัติได้", "error");
              }
            });
          } else {
            setHistory([]);
          }
        });
        return () => {
          if (unsubscribeHistory) unsubscribeHistory();
          unsubscribeAuth();
        };
      }, []);

      const handleGoogleLogin = async () => {
        const provider = new firebase.auth.GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        try {
          await auth.signInWithPopup(provider);
          showAlert("เข้าสู่ระบบสำเร็จ!", "success");
        } catch (error) {
          showAlert(`เข้าสู่ระบบไม่สำเร็จ: ${error.message}`, "error");
        }
      };

      const handleLogout = async () => {
        try {
          await auth.signOut();
          showAlert("ออกจากระบบเรียบร้อยแล้ว", "info");
        } catch (err) {
          showAlert("ออกจากระบบไม่สำเร็จ: " + err.message, "error");
        }
      };

      useEffect(() => {
        if (selectedParticipants.length === 0 && friends.length > 0) {
          setSelectedParticipants(friends.map(f => f.id));
        }
        if (!expensePayerId && friends.length > 0) {
          setExpensePayerId(friends[0].id);
        }
      }, [friends]);

      const handleAddFriend = (e) => {
        e.preventDefault();
        if (!newFriendName.trim()) return;

        const newFriend = {
          id: 'friend_' + Date.now().toString(),
          name: newFriendName.trim(),
          promptPay: newFriendPromptPay.trim(),
          headcount: Math.max(1, parseInt(newFriendHeadcount) || 1),
        };

        setFriends([...friends, newFriend]);
        setNewFriendName('');
        setNewFriendPromptPay('');
        setNewFriendHeadcount(1);
        
        if (selectedParticipants.length > 0) {
          setSelectedParticipants([...selectedParticipants, newFriend.id]);
        }
      };

      const handleDeleteFriend = (id) => {
        setFriends(friends.filter(f => f.id !== id));
        setExpenses(expenses.map(exp => ({
          ...exp,
          participantIds: exp.participantIds.filter(pId => pId !== id),
        })).filter(exp => exp.payerId !== id));
        setSelectedParticipants(selectedParticipants.filter(pId => pId !== id));
      };

      const handleUpdateHeadcount = (id, delta) => {
        setFriends(friends.map(f => {
          if (f.id === id) {
            return { ...f, headcount: Math.max(1, f.headcount + delta) };
          }
          return f;
        }));
      };

      const handleToggleParticipant = (friendId) => {
        if (selectedParticipants.includes(friendId)) {
          setSelectedParticipants(selectedParticipants.filter(id => id !== friendId));
        } else {
          setSelectedParticipants([...selectedParticipants, friendId]);
        }
      };

      const handleSelectAllParticipants = () => {
        if (selectedParticipants.length === friends.length) {
          setSelectedParticipants([]);
        } else {
          setSelectedParticipants(friends.map(f => f.id));
        }
      };

      const handleAddExpense = async (e) => {
        e.preventDefault();
        const numAmount = parseFloat(expenseAmount);
        if (!expenseTitle.trim() || isNaN(numAmount) || numAmount <= 0 || !expensePayerId || selectedParticipants.length === 0) {
          showAlert("กรุณากรอกข้อมูลรายการและจำนวนเงินให้ถูกต้อง", "error");
          return;
        }

        setUploading(true);
        let receiptUrl = null;

        // อัพโหลดไฟล์ใบเสร็จ (ถ้ามี)
        if (receiptFile) {
          if (!user) {
            showAlert("ต้องเข้าสู่ระบบก่อนจึงจะแนบรูปใบเสร็จได้", "error");
            setUploading(false);
            return;
          }
          try {
            const fileExt = receiptFile.name.split('.').pop();
            const fileName = `receipt_${Date.now()}.${fileExt}`;
            const fileRef = storage.ref().child(`receipts/${user.uid}/${fileName}`);
            await fileRef.put(receiptFile);
            receiptUrl = await fileRef.getDownloadURL();
          } catch (err) {
            console.error(err);
            showAlert("อัพโหลดใบเสร็จไม่สำเร็จ โปรดลองตรวจสอบ Storage Rules", "error");
            setUploading(false);
            return;
          }
        }

        const newExpense = {
          id: 'exp_' + Date.now().toString(),
          date: expenseDate,
          title: expenseTitle.trim(),
          amount: numAmount,
          payerId: expensePayerId,
          participantIds: [...selectedParticipants],
          receiptUrl: receiptUrl
        };

        setExpenses([...expenses, newExpense]);
        setExpenseTitle('');
        setExpenseAmount('');
        setReceiptFile(null);
        if (fileInputRef.current) fileInputRef.current.value = "";
        setSelectedParticipants(friends.map(f => f.id));
        setUploading(false);
      };

      const handleDeleteExpense = (id) => {
        setExpenses(expenses.filter(e => e.id !== id));
      };

      const calculations = useMemo(() => {
        const friendTotals = {};
        friends.forEach(f => {
          friendTotals[f.id] = {
            id: f.id,
            name: f.name,
            promptPay: f.promptPay,
            headcount: f.headcount,
            paid: 0,
            shouldPay: 0,
            netBalance: 0,
          };
        });

        let totalExpenseAmount = 0;

        expenses.forEach(exp => {
          totalExpenseAmount += exp.amount;
          if (friendTotals[exp.payerId]) {
            friendTotals[exp.payerId].paid += exp.amount;
          }

          let totalHeadcountForExpense = 0;
          exp.participantIds.forEach(pId => {
            if (friendTotals[pId]) {
              totalHeadcountForExpense += friendTotals[pId].headcount;
            }
          });

          if (totalHeadcountForExpense > 0) {
            const costPerHead = exp.amount / totalHeadcountForExpense;
            exp.participantIds.forEach(pId => {
              if (friendTotals[pId]) {
                friendTotals[pId].shouldPay += costPerHead * friendTotals[pId].headcount;
              }
            });
          }
        });

        Object.values(friendTotals).forEach(f => {
          f.netBalance = f.paid - f.shouldPay;
        });

        const debtors = [];
        const creditors = [];

        Object.values(friendTotals).forEach(f => {
          if (f.netBalance < -0.01) debtors.push({ ...f, amountOwed: Math.abs(f.netBalance) });
          else if (f.netBalance > 0.01) creditors.push({ ...f, amountToReceive: f.netBalance });
        });

        debtors.sort((a, b) => b.amountOwed - a.amountOwed);
        creditors.sort((a, b) => b.amountToReceive - a.amountToReceive);

        const settlements = [];
        let i = 0, j = 0;

        while (i < debtors.length && j < creditors.length) {
          const debtor = debtors[i];
          const creditor = creditors[j];
          const settlementAmount = Math.min(debtor.amountOwed, creditor.amountToReceive);

          if (settlementAmount > 0.01) {
            settlements.push({
              fromId: debtor.id,
              fromName: debtor.name,
              toId: creditor.id,
              toName: creditor.name,
              toPromptPay: creditor.promptPay,
              amount: settlementAmount,
            });
          }

          debtor.amountOwed -= settlementAmount;
          creditor.amountToReceive -= settlementAmount;

          if (debtor.amountOwed < 0.01) i++;
          if (creditor.amountToReceive < 0.01) j++;
        }

        return {
          friendTotals: Object.values(friendTotals),
          settlements,
          totalExpenseAmount,
        };
      }, [friends, expenses]);

      const generateSummaryText = () => {
        const finalTripName = tripName.trim() || getDefaultTripName();
        let summaryText = `🏕️ *สรุปค่าใช้จ่าย: ${finalTripName}*\n`;
        summaryText += `💰 ยอดรวมทั้งหมด: ${calculations.totalExpenseAmount.toLocaleString()} บาท\n\n`;
        
        summaryText += `👥 *รายละเอียดต่อคน/กลุ่ม:*\n`;
        calculations.friendTotals.forEach(f => {
          summaryText += `- ${f.name} (${f.headcount} คน): จ่ายแล้ว ${f.paid.toLocaleString()} บ. | ค่าใช้จ่ายจริง ${f.shouldPay.toLocaleString('th-TH', { maximumFractionDigits: 2 })} บ.\n`;
        });

        summaryText += `\n💸 *สรุปการเคลียร์ยอด (ใครโอนให้ใคร):*\n`;
        if (calculations.settlements.length === 0) {
          summaryText += `✨ เคลียร์ยอดครบแล้ว ไม่มีใครต้องโอนเพิ่ม!\n`;
        } else {
          calculations.settlements.forEach(s => {
            const ppText = s.toPromptPay ? ` (พร้อมเพย์: ${s.toPromptPay})` : '';
            summaryText += `- 👉 ${s.fromName} โอนให้ ${s.toName}${ppText} : *${s.amount.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} บาท*\n`;
          });
        }
        return summaryText;
      };

      const handleSaveToCloud = async (saveAsNew = false) => {
        if (!user) return showAlert("กรุณาเข้าสู่ระบบด้วย Google ก่อนบันทึกทริป", "error");
        if (friends.length === 0 && expenses.length === 0) return showAlert("ยังไม่มีข้อมูลเพื่อนหรือค่าใช้จ่ายให้บันทึก", "error");

        setSaving(true);
        const finalTripName = tripName.trim() || getDefaultTripName();
        const tripData = {
          tripName: finalTripName,
          date: new Date().toLocaleString('th-TH'),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
          totalAmount: calculations.totalExpenseAmount,
          summaryText: generateSummaryText(),
          friendsCount: friends.length,
          expensesCount: expenses.length,
          friendsData: friends,
          expensesData: expenses
        };

        try {
          const userTripsRef = db.collection("users").doc(user.uid).collection("trips");
          if (currentTripId && !saveAsNew) {
            await userTripsRef.doc(currentTripId).set(tripData, { merge: true });
            showAlert(`☁️ อัปเดต "${finalTripName}" สำเร็จ!`, "success");
          } else {
            tripData.createdAt = firebase.firestore.FieldValue.serverTimestamp();
            const newDoc = await userTripsRef.add(tripData);
            setCurrentTripId(newDoc.id);
            showAlert(`☁️ บันทึก "${finalTripName}" เป็นทริปใหม่เรียบร้อย!`, "success");
          }
        } catch (err) {
          showAlert("เกิดข้อผิดพลาดในการบันทึก: " + err.message, "error");
        } finally {
          setSaving(false);
        }
      };

      const handleLoadTripForEdit = (record) => {
        setTripName(record.tripName || getDefaultTripName());
        setFriends(record.friendsData || []);
        setExpenses(record.expensesData || []);
        setCurrentTripId(record.id);
        setShowHistoryModal(false);
        showAlert(`📥 โหลดข้อมูล "${record.tripName || 'ทริป'}" เพื่อแก้ไขเรียบร้อย`, "info");
      };

      const handleDeleteHistoryRecord = async (tripId, e) => {
        e.stopPropagation();
        if (!user) return;
        if (window.confirm("คุณต้องการลบประวัตินี้หรือไม่?")) {
          try {
            await db.collection("users").doc(user.uid).collection("trips").doc(tripId).delete();
            if (currentTripId === tripId) setCurrentTripId(null);
            showAlert("ลบประวัติเรียบร้อยแล้ว", "info");
          } catch (err) {
            showAlert("ไม่สามารถลบได้: " + err.message, "error");
          }
        }
      };

      const handleCopySummary = () => {
        const summaryText = generateSummaryText();
        const textarea = document.createElement("textarea");
        textarea.value = summaryText;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();
        try {
          document.execCommand("copy");
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
          showAlert("คัดลอกสรุปข้อความแล้ว นำไปส่งลง LINE ได้เลย!", "success");
        } catch (err) {
          showAlert("คัดลอกไม่สำเร็จ โปรดลองอีกครั้ง", "error");
        } finally {
          document.body.removeChild(textarea);
        }
      };

      const confirmReset = () => {
        setFriends([]);
        setExpenses([]);
        setCurrentTripId(null);
        setTripName(getDefaultTripName());
        setShowResetModal(false);
        showAlert("ล้างข้อมูลปัจจุบันเรียบร้อยแล้ว", "info");
      };

      // เรียงลำดับค่าใช้จ่ายตามวันที่ (เก่า -> ใหม่)
      const sortedExpenses = [...expenses].sort((a, b) => new Date(a.date) - new Date(b.date));

      return (
        <div className="min-h-screen pb-20">
          {alertMsg && (
            <div className={`fixed top-4 right-4 z-50 px-4 py-3 rounded-xl shadow-2xl flex items-center gap-2 text-sm border animate-bounce ${
              alertMsg.type === 'error' ? 'bg-rose-900/90 border-rose-500 text-rose-100' :
              alertMsg.type === 'success' ? 'bg-emerald-900/90 border-emerald-500 text-emerald-100' :
              'bg-slate-800 border-slate-600 text-slate-100'
            }`}>
              <Icon name={alertMsg.type === 'error' ? 'alert-circle' : alertMsg.type === 'success' ? 'check-circle' : 'info'} className="w-5 h-5" />
              <span>{alertMsg.message}</span>
            </div>
          )}

          <header className="bg-slate-800/95 border-b border-slate-700 sticky top-0 z-40 backdrop-blur-md">
            <div className="max-w-5xl mx-auto px-4 py-3.5 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="p-2.5 bg-emerald-500/20 text-emerald-400 rounded-xl border border-emerald-500/30">
                  <Icon name="pie-chart" className="w-6 h-6" />
                </div>
                <div>
                  <h1 className="text-xl font-bold bg-gradient-to-r from-emerald-400 to-teal-300 bg-clip-text text-transparent flex items-center gap-2">
                    หารค่าใช้จ่ายทริป
                    {currentTripId && (
                      <span className="text-[10px] bg-amber-500/20 text-amber-300 border border-amber-500/40 px-2 py-0.5 rounded-full font-normal">
                        โหมดแก้ไขทริป
                      </span>
                    )}
                  </h1>
                  <p className="text-xs text-slate-400">คำนวณง่าย หารแฟร์ เซฟลง Cloud แก้ไขได้ตลอดเวลา</p>
                </div>
              </div>

              <div className="flex items-center gap-2">
                {loading ? (
                  <span className="text-xs text-slate-400">กำลังโหลด...</span>
                ) : user ? (
                  <div className="flex items-center gap-2">
                    <button 
                      onClick={() => setShowHistoryModal(true)}
                      className="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded-xl transition-all flex items-center gap-1.5 text-xs font-medium border border-slate-600 shadow-sm"
                    >
                      <Icon name="folder-clock" className="w-4 h-4 text-amber-400" />
                      <span className="hidden sm:inline">ประวัติทริป ({history.length})</span>
                    </button>
                    <div className="flex items-center gap-1.5 bg-slate-800 border border-slate-700 rounded-xl p-1 pr-2">
                      <img src={user.photoURL || 'https://via.placeholder.com/32'} alt={user.displayName} className="w-6 h-6 rounded-full border border-emerald-400 object-cover" />
                      <button onClick={handleLogout} className="text-xs text-slate-400 hover:text-rose-400" title="ออกจากระบบ">
                        <Icon name="log-out" className="w-3.5 h-3.5" />
                      </button>
                    </div>
                  </div>
                ) : (
                  <button 
                    onClick={handleGoogleLogin}
                    className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-3 py-2 rounded-xl flex items-center gap-2 transition-all shadow-lg"
                  >
                    <Icon name="log-in" className="w-4 h-4" /> เข้าสู่ระบบ Google
                  </button>
                )}
                <button 
                  onClick={() => setShowResetModal(true)}
                  className="text-slate-400 hover:text-rose-400 p-2 rounded-xl hover:bg-slate-700/50 transition-colors"
                  title="เริ่มทริปใหม่ / ล้างข้อมูล"
                >
                  <Icon name="rotate-ccw" className="w-4 h-4" />
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-5xl mx-auto px-4 pt-6 space-y-6">
            
            {/* Trip Name Banner */}
            <div className="bg-gradient-to-r from-slate-800 to-slate-800/80 border border-slate-700/80 rounded-2xl p-4 shadow-xl flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
              <div className="flex-1 w-full">
                <label className="block text-xs font-medium text-amber-300 mb-1 flex items-center gap-1.5">
                  <Icon name="map-pin" className="w-3.5 h-3.5" /> ชื่อทริป
                </label>
                <div className="flex items-center gap-2">
                  <input
                    type="text"
                    placeholder={getDefaultTripName()}
                    value={tripName}
                    onChange={(e) => setTripName(e.target.value)}
                    className="w-full bg-slate-900 border border-slate-700 focus:border-amber-400 rounded-xl px-3.5 py-2 text-sm font-semibold text-slate-100 outline-none"
                  />
                  <button type="button" onClick={() => setTripName(getDefaultTripName())} className="shrink-0 px-2.5 py-2 text-xs bg-slate-700 hover:bg-slate-600 rounded-xl text-slate-300">วันที่วันนี้</button>
                </div>
              </div>
            </div>

            {/* Step 1: Manage Friends */}
            <section className="bg-slate-800/80 border border-slate-700/80 rounded-2xl p-5 shadow-xl">
              <div className="flex items-center justify-between mb-4">
                <div className="flex items-center gap-2">
                  <div className="w-7 h-7 rounded-lg bg-indigo-500/20 text-indigo-400 flex items-center justify-center font-bold text-sm">1</div>
                  <h2 className="text-lg font-semibold flex items-center gap-2">
                    <Icon name="users" className="w-5 h-5 text-indigo-400" /> รายชื่อเพื่อน & ช่องทางรับเงิน
                  </h2>
                </div>
                <span className="text-xs bg-slate-700 text-slate-300 px-2.5 py-1 rounded-full font-medium">
                  รวม {friends.reduce((acc, f) => acc + f.headcount, 0)} คน
                </span>
              </div>

              <form onSubmit={handleAddFriend} className="grid grid-cols-1 sm:grid-cols-12 gap-3 mb-5">
                <div className="sm:col-span-4">
                  <input type="text" placeholder="ชื่อเพื่อน..." value={newFriendName} onChange={(e) => setNewFriendName(e.target.value)} className="w-full bg-slate-900 border border-slate-700 focus:border-indigo-500 rounded-xl px-4 py-2 text-sm outline-none" />
                </div>
                <div className="sm:col-span-3">
                  <input type="text" placeholder="พร้อมเพย์ (ถ้ามี)" value={newFriendPromptPay} onChange={(e) => setNewFriendPromptPay(e.target.value)} className="w-full bg-slate-900 border border-slate-700 focus:border-indigo-500 rounded-xl px-4 py-2 text-sm outline-none" />
                </div>
                <div className="sm:col-span-3 flex items-center bg-slate-900 border border-slate-700 rounded-xl px-3 py-1">
                  <span className="text-xs text-slate-400 mr-2">จำนวนคน:</span>
                  <button type="button" onClick={() => setNewFriendHeadcount(Math.max(1, newFriendHeadcount - 1))} className="w-6 h-6 rounded-lg bg-slate-800 text-slate-300 font-bold hover:bg-slate-700">-</button>
                  <span className="flex-1 text-center font-semibold text-sm text-indigo-300">{newFriendHeadcount}</span>
                  <button type="button" onClick={() => setNewFriendHeadcount(newFriendHeadcount + 1)} className="w-6 h-6 rounded-lg bg-slate-800 text-slate-300 font-bold hover:bg-slate-700">+</button>
                </div>
                <div className="sm:col-span-2">
                  <button type="submit" disabled={!newFriendName.trim()} className="w-full h-full bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white font-medium py-2 rounded-xl text-sm flex items-center justify-center gap-1.5 shadow-lg">
                    <Icon name="user-plus" className="w-4 h-4" /> เพิ่ม
                  </button>
                </div>
              </form>

              {friends.length > 0 && (
                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                  {friends.map((friend) => (
                    <div key={friend.id} className="bg-slate-900/80 border border-slate-700/60 rounded-xl p-3 flex items-center justify-between">
                      <div className="overflow-hidden mr-2">
                        <p className="font-medium text-slate-200 text-sm truncate">{friend.name}</p>
                        <p className="text-[11px] text-slate-400">{friend.promptPay ? `PP: ${friend.promptPay}` : 'ไม่ระบุพร้อมเพย์'} | {friend.headcount} คน</p>
                      </div>
                      <div className="flex items-center gap-1.5 shrink-0">
                        <button onClick={() => handleDeleteFriend(friend.id)} className="p-1.5 text-slate-500 hover:text-rose-400 transition-colors">
                          <Icon name="trash-2" className="w-4 h-4" />
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </section>

            {/* Step 2: Expenses */}
            <section className="bg-slate-800/80 border border-slate-700/80 rounded-2xl p-5 shadow-xl">
              <div className="flex items-center gap-2 mb-4">
                <div className="w-7 h-7 rounded-lg bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-bold text-sm">2</div>
                <h2 className="text-lg font-semibold flex items-center gap-2">
                  <Icon name="receipt" className="w-5 h-5 text-emerald-400" /> บันทึกรายการจ่าย
                </h2>
              </div>

              <div className="mb-4">
                <div className="flex flex-wrap gap-1.5">
                  {POPULAR_CATEGORIES.map((cat, idx) => (
                    <button key={idx} type="button" onClick={() => setExpenseTitle(cat.title)} className="text-xs bg-slate-900/90 hover:bg-slate-700 text-slate-300 border border-slate-700 px-2.5 py-1 rounded-lg">
                      {cat.label}
                    </button>
                  ))}
                </div>
              </div>

              <form onSubmit={handleAddExpense} className="space-y-3">
                <div className="grid grid-cols-1 sm:grid-cols-12 gap-3">
                  <div className="sm:col-span-3">
                    <label className="block text-xs font-medium text-slate-400 mb-1">วันที่จ่าย</label>
                    <input type="date" value={expenseDate} onChange={(e) => setExpenseDate(e.target.value)} className="w-full bg-slate-900 border border-slate-700 focus:border-emerald-500 rounded-xl px-3 py-2 text-sm outline-none text-slate-200" />
                  </div>
                  <div className="sm:col-span-6">
                    <label className="block text-xs font-medium text-slate-400 mb-1">ชื่อรายการค่าใช้จ่าย</label>
                    <input type="text" placeholder="เช่น ค่ากุ้งเผา..." value={expenseTitle} onChange={(e) => setExpenseTitle(e.target.value)} className="w-full bg-slate-900 border border-slate-700 focus:border-emerald-500 rounded-xl px-4 py-2 text-sm outline-none" />
                  </div>
                  <div className="sm:col-span-3">
                    <label className="block text-xs font-medium text-slate-400 mb-1">จำนวนเงิน</label>
                    <input type="number" step="any" placeholder="0.00" value={expenseAmount} onChange={(e) => setExpenseAmount(e.target.value)} className="w-full bg-slate-900 border border-slate-700 focus:border-emerald-500 rounded-xl px-4 py-2 text-sm outline-none font-mono" />
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-12 gap-3 pb-2">
                  <div className="sm:col-span-6">
                    <label className="block text-xs font-medium text-slate-400 mb-1">ใครเป็นคนออกเงินก่อน?</label>
                    <select value={expensePayerId} onChange={(e) => setExpensePayerId(e.target.value)} className="w-full bg-slate-900 border border-slate-700 focus:border-emerald-500 rounded-xl px-3 py-2 text-sm outline-none text-slate-200">
                      {friends.length === 0 ? <option value="">โปรดเพิ่มเพื่อนก่อน</option> : friends.map(f => <option key={f.id} value={f.id}>{f.name} (จ่าย)</option>)}
                    </select>
                  </div>
                  <div className="sm:col-span-6">
                    <label className="block text-xs font-medium text-slate-400 mb-1">แนบรูปสลิป / ใบเสร็จ (ถ้ามี)</label>
                    <input type="file" accept="image/*" ref={fileInputRef} onChange={(e) => setReceiptFile(e.target.files[0])} className="w-full text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-slate-700 file:text-emerald-300 hover:file:bg-slate-600 bg-slate-900 border border-slate-700 rounded-xl px-2 py-1.5 outline-none cursor-pointer" />
                  </div>
                </div>

                <div className="pt-1">
                  <div className="flex items-center justify-between mb-2">
                    <label className="text-xs font-medium text-slate-300">คนร่วมหารในบิลนี้</label>
                    {friends.length > 0 && (
                      <button type="button" onClick={handleSelectAllParticipants} className="text-xs text-emerald-400">
                        {selectedParticipants.length === friends.length ? 'ยกเลิกทั้งหมด' : 'เลือกทุกคน'}
                      </button>
                    )}
                  </div>
                  <div className="flex flex-wrap gap-2">
                    {friends.map((friend) => (
                      <button key={friend.id} type="button" onClick={() => handleToggleParticipant(friend.id)} className={`px-3 py-1.5 rounded-xl text-xs font-medium flex items-center gap-1.5 border transition-all ${selectedParticipants.includes(friend.id) ? 'bg-emerald-500/15 border-emerald-500/50 text-emerald-300' : 'bg-slate-900/50 border-slate-700 text-slate-500'}`}>
                        <Icon name={selectedParticipants.includes(friend.id) ? "check-square" : "square"} className="w-3.5 h-3.5" /> {friend.name}
                      </button>
                    ))}
                  </div>
                </div>

                <button type="submit" disabled={uploading || !expenseTitle.trim() || !expenseAmount || !expensePayerId || selectedParticipants.length === 0} className="w-full bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white font-medium py-2.5 px-4 rounded-xl text-sm flex items-center justify-center gap-2 mt-2">
                  {uploading ? (
                    <><Icon name="loader" className="w-4 h-4 animate-spin" /> กำลังอัพโหลดใบเสร็จและบันทึก...</>
                  ) : (
                    <><Icon name="plus" className="w-4 h-4" /> บันทึกรายการนี้</>
                  )}
                </button>
              </form>

              {/* รายการจ่ายที่เรียงตามวันที่ */}
              <div className="mt-6 border-t border-slate-700/60 pt-4">
                <h3 className="text-sm font-semibold text-slate-300 mb-3 flex items-center justify-between">
                  <span>รายการบันทึกแล้ว ({expenses.length})</span>
                  <span className="text-xs text-slate-400">รวม: <strong className="text-emerald-400 font-mono text-sm">฿{calculations.totalExpenseAmount.toLocaleString()}</strong></span>
                </h3>
                
                {sortedExpenses.length === 0 ? (
                  <div className="text-center py-5 text-slate-500 border border-dashed border-slate-700/60 rounded-xl text-xs">ยังไม่มีรายการค่าใช้จ่าย</div>
                ) : (
                  <div className="space-y-2 max-h-80 overflow-y-auto pr-1">
                    {sortedExpenses.map((exp) => {
                      const payer = friends.find(f => f.id === exp.payerId);
                      const pNames = exp.participantIds.map(pId => (friends.find(fr => fr.id === pId) || {}).name).filter(Boolean).join(', ');
                      return (
                        <div key={exp.id} className="bg-slate-900/60 border border-slate-700/50 rounded-xl p-3 flex items-start justify-between">
                          <div className="overflow-hidden mr-2">
                            <p className="font-medium text-slate-200 text-sm">{exp.title} <span className="text-emerald-400 font-mono">- ฿{exp.amount.toLocaleString()}</span></p>
                            <p className="text-[11px] text-slate-400 mt-1">
                              <span className="text-amber-300">📅 {new Date(exp.date).toLocaleDateString('th-TH', { day:'numeric', month:'short' })}</span> | จ่าย: {payer ? payer.name : '-'} | หาร: <span className="truncate">{pNames || 'ทุกคน'}</span>
                            </p>
                            {exp.receiptUrl && (
                              <a href={exp.receiptUrl} target="_blank" rel="noreferrer" className="inline-flex items-center gap-1 mt-1.5 text-xs text-blue-400 hover:text-blue-300 bg-blue-900/30 px-2 py-0.5 rounded">
                                <Icon name="image" className="w-3 h-3" /> ดูใบเสร็จ
                              </a>
                            )}
                          </div>
                          <button onClick={() => handleDeleteExpense(exp.id)} className="text-slate-500 hover:text-rose-400 p-1">
                            <Icon name="trash-2" className="w-4 h-4" />
                          </button>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            </section>

            {/* Results Section */}
            <section className="grid grid-cols-1 md:grid-cols-12 gap-6">
              <div className="md:col-span-6 bg-slate-800/80 border border-slate-700/80 rounded-2xl p-5 shadow-xl flex flex-col justify-between">
                <div>
                  <h2 className="text-lg font-semibold flex items-center gap-2 mb-4">
                    <Icon name="dollar-sign" className="w-5 h-5 text-teal-400" /> สรุปยอดรายคน/กลุ่ม
                  </h2>
                  <div className="space-y-2.5">
                    {calculations.friendTotals.map((f) => (
                      <div key={f.id} className="bg-slate-900/80 border border-slate-700/60 rounded-xl p-3 flex items-center justify-between text-xs">
                        <div>
                          <p className="font-semibold text-slate-200 text-sm">{f.name}</p>
                          <p className="text-slate-400">จ่ายไป {f.paid.toLocaleString()} บ. (ใช้จริง {f.shouldPay.toLocaleString('th-TH', { maximumFractionDigits: 1 })})</p>
                        </div>
                        <p className={`font-mono font-bold text-sm ${f.netBalance > 0.01 ? 'text-emerald-400' : f.netBalance < -0.01 ? 'text-rose-400' : 'text-slate-400'}`}>
                          {f.netBalance > 0.01 ? `+รับ ${f.netBalance.toLocaleString('th-TH', { maximumFractionDigits: 1 })}` : f.netBalance < -0.01 ? `ต้องจ่าย ${Math.abs(f.netBalance).toLocaleString('th-TH', { maximumFractionDigits: 1 })}` : 'สมดุล (0)'}
                        </p>
                      </div>
                    ))}
                  </div>
                </div>
              </div>

              <div className="md:col-span-6 bg-slate-800/80 border border-slate-700/80 rounded-2xl p-5 shadow-xl flex flex-col justify-between">
                <div>
                  <h2 className="text-lg font-semibold flex items-center gap-2 mb-4 text-amber-300">
                    <Icon name="sparkles" className="w-5 h-5 text-amber-400" /> สรุปการโอน (เคลียร์ยอด)
                  </h2>
                  <div className="space-y-2.5 mb-4">
                    {calculations.settlements.length === 0 ? (
                      <div className="text-center py-6 bg-slate-900/50 rounded-xl text-slate-400 text-sm border border-slate-800">
                        {expenses.length === 0 ? 'ยังไม่มีค่าใช้จ่าย' : '🎉 เคลียร์ยอดลงตัวแล้ว!'}
                      </div>
                    ) : (
                      calculations.settlements.map((s, index) => (
                        <div key={index} className="bg-slate-900 border border-amber-500/30 rounded-xl p-3 flex items-center justify-between shadow-inner">
                          <div className="flex flex-col">
                            <span className="font-semibold text-sm flex items-center gap-1.5">
                              <span className="text-slate-200">{s.fromName}</span>
                              <span className="text-amber-400 text-xs">โอนให้ 👉</span>
                              <span className="text-emerald-300">{s.toName}</span>
                            </span>
                            {s.toPromptPay && <span className="text-[10px] text-emerald-500 mt-0.5">พร้อมเพย์: {s.toPromptPay}</span>}
                          </div>
                          <span className="font-mono font-bold text-amber-400 text-sm">฿{s.amount.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</span>
                        </div>
                      ))
                    )}
                  </div>
                </div>

                <div className="space-y-2 pt-2">
                  <div className="flex gap-2">
                    <button onClick={() => handleSaveToCloud(false)} disabled={saving || (!friends.length && !expenses.length)} className="flex-1 bg-slate-700 hover:bg-slate-600 disabled:opacity-50 text-slate-100 py-2.5 px-3 rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 border border-slate-600">
                      <Icon name="cloud-upload" className="w-4 h-4 text-amber-400" />
                      {saving ? "กำลังบันทึก..." : (currentTripId ? "อัปเดตทริปนี้" : "บันทึกลง Cloud")}
                    </button>
                    {currentTripId && (
                      <button onClick={() => handleSaveToCloud(true)} disabled={saving} className="bg-slate-700 hover:bg-slate-600 text-amber-300 py-2.5 px-3 rounded-xl text-xs font-semibold flex items-center border border-amber-500/40">
                        บันทึกอันใหม่
                      </button>
                    )}
                  </div>
                  <button onClick={handleCopySummary} disabled={expenses.length === 0} className={`w-full py-3 px-4 rounded-xl text-sm font-semibold transition-all flex items-center justify-center gap-2 shadow-lg ${copied ? 'bg-emerald-600 text-white' : 'bg-amber-500 hover:bg-amber-400 text-slate-950 disabled:opacity-50'}`}>
                    <Icon name={copied ? "check" : "copy"} className="w-4 h-4" />
                    {copied ? 'คัดลอกสรุปเรียบร้อยแล้ว!' : 'คัดลอกสรุปข้อความ (ส่ง LINE)'}
                  </button>
                </div>
              </div>
            </section>
          </main>

          {/* Modals (History & Reset) ... keep as is */}
          {showHistoryModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-800 border border-slate-700 rounded-2xl max-w-xl w-full p-6 space-y-4 shadow-2xl max-h-[85vh] flex flex-col">
                <div className="flex items-center justify-between border-b border-slate-700 pb-3">
                  <h3 className="text-lg font-bold text-slate-100"><Icon name="folder-clock" className="inline w-5 h-5 text-amber-400 mr-2" /> ประวัติทริป</h3>
                  <button onClick={() => setShowHistoryModal(false)} className="text-slate-400 hover:text-slate-200">✕</button>
                </div>
                <div className="overflow-y-auto space-y-3 flex-1 pr-1">
                  {history.map((record) => (
                    <div key={record.id} className="bg-slate-900 border border-slate-700/80 rounded-xl p-3.5 space-y-2">
                      <div className="flex justify-between border-b border-slate-800 pb-2">
                        <div>
                          <h4 className="font-bold text-amber-300 text-sm">{record.tripName || 'ทริปไม่มีชื่อ'}</h4>
                          <span className="text-[11px] text-slate-400">บันทึกเมื่อ: {record.date}</span>
                        </div>
                        <div className="flex items-center gap-2">
                          <button onClick={() => handleLoadTripForEdit(record)} className="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-semibold">โหลด</button>
                          <button onClick={(e) => handleDeleteHistoryRecord(record.id, e)} className="p-1 text-slate-500 hover:text-rose-400"><Icon name="trash-2" className="w-4 h-4" /></button>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {showResetModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-800 border border-slate-700 rounded-2xl max-w-sm w-full p-6 space-y-4">
                <h3 className="text-lg font-bold text-rose-400">ยืนยันการเริ่มใหม่?</h3>
                <p className="text-sm text-slate-300">ข้อมูลปัจจุบันบนจอจะหายไป (ไม่กระทบประวัติที่เซฟแล้ว)</p>
                <div className="flex gap-3 pt-2">
                  <button onClick={() => setShowResetModal(false)} className="flex-1 px-4 py-2 bg-slate-700 text-slate-200 rounded-xl text-sm">ยกเลิก</button>
                  <button onClick={confirmReset} className="flex-1 px-4 py-2 bg-rose-600 hover:bg-rose-500 text-white rounded-xl text-sm">เริ่มใหม่</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
