<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบหารค่าใช้จ่ายทริปเพื่อน & บันทึกประวัติ (Cloud)</title>
  
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel CDN for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Firebase SDKs (Compat version for HTML script import) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    // ----------------------------------------------------
    // 1. Firebase Configuration (ใส่ Config ของคุณเรียบร้อยแล้ว)
    // ----------------------------------------------------
    const firebaseConfig = {
      apiKey: "AIzaSyCwvoRRmlGk6C-S2PbsZbkm2P5B2E98Hks",
      authDomain: "trip-expense-calculator-9261b.firebaseapp.com",
      projectId: "trip-expense-calculator-9261b",
      storageBucket: "trip-expense-calculator-9261b.firebasestorage.app",
      messagingSenderId: "211000271288",
      appId: "1:211000271288:web:e76cc31d65834a09db6f4d",
      measurementId: "G-N4DE2DLX4W"
    };

    // Initialize Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    const { useState, useMemo, useEffect } = React;

    // Custom Icon Wrapper component for Lucide
    const Icon = ({ name, className = "w-4 h-4" }) => {
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [name]);
      return <i data-lucide={name} className={className}></i>;
    };

    function App() {
      // User Auth State
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);

      // Data States
      const [friends, setFriends] = useState([]);
      const [expenses, setExpenses] = useState([]);
      const [history, setHistory] = useState([]);

      // Inputs state
      const [newFriendName, setNewFriendName] = useState('');
      const [newFriendHeadcount, setNewFriendHeadcount] = useState(1);
      const [expenseTitle, setExpenseTitle] = useState('');
      const [expenseAmount, setExpenseAmount] = useState('');
      const [expensePayerId, setExpensePayerId] = useState('');
      const [selectedParticipants, setSelectedParticipants] = useState([]);
      
      // UI Modals & Feedback
      const [copied, setCopied] = useState(false);
      const [showResetModal, setShowResetModal] = useState(false);
      const [showHistoryModal, setShowHistoryModal] = useState(false);
      const [saving, setSaving] = useState(false);

      // ----------------------------------------------------
      // 2. ดักจับสถานะการ Login และโหลดข้อมูลจาก Cloud Firestore
      // ----------------------------------------------------
      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged((currentUser) => {
          setUser(currentUser);
          setLoading(false);

          if (currentUser) {
            // ดึงข้อมูลทริปย้อนหลังของผู้ใช้
            const historyRef = db.collection("users").doc(currentUser.uid).collection("trips");
            historyRef.orderBy("createdAt", "desc").onSnapshot((snapshot) => {
              const tripsData = snapshot.docs.map(doc => ({
                id: doc.id,
                ...doc.data()
              }));
              setHistory(tripsData);
            });
          } else {
            setHistory([]);
          }
        });

        return () => unsubscribe();
      }, []);

      // Google Sign-In
      const handleGoogleLogin = async () => {
        const provider = new firebase.auth.GoogleAuthProvider();
        try {
          await auth.signInWithPopup(provider);
        } catch (error) {
          alert("ไม่สามารถเข้าสู่ระบบได้: " + error.message);
        }
      };

      // Logout
      const handleLogout = () => {
        auth.signOut();
      };

      useEffect(() => {
        if (selectedParticipants.length === 0 && friends.length > 0) {
          setSelectedParticipants(friends.map(f => f.id));
        }
        if (!expensePayerId && friends.length > 0) {
          setExpensePayerId(friends[0].id);
        }
      }, [friends]);

      const handleAddFriend = (e) => {
        e.preventDefault();
        if (!newFriendName.trim()) return;

        const newFriend = {
          id: Date.now().toString(),
          name: newFriendName.trim(),
          headcount: Math.max(1, parseInt(newFriendHeadcount) || 1),
        };

        setFriends([...friends, newFriend]);
        setNewFriendName('');
        setNewFriendHeadcount(1);
        
        if (selectedParticipants.length > 0) {
          setSelectedParticipants([...selectedParticipants, newFriend.id]);
        }
      };

      const handleDeleteFriend = (id) => {
        setFriends(friends.filter(f => f.id !== id));
        setExpenses(expenses.map(exp => ({
          ...exp,
          participantIds: exp.participantIds.filter(pId => pId !== id),
        })).filter(exp => exp.payerId !== id));
        setSelectedParticipants(selectedParticipants.filter(pId => pId !== id));
      };

      const handleUpdateHeadcount = (id, delta) => {
        setFriends(friends.map(f => {
          if (f.id === id) {
            return { ...f, headcount: Math.max(1, f.headcount + delta) };
          }
          return f;
        }));
      };

      const handleToggleParticipant = (friendId) => {
        if (selectedParticipants.includes(friendId)) {
          setSelectedParticipants(selectedParticipants.filter(id => id !== friendId));
        } else {
          setSelectedParticipants([...selectedParticipants, friendId]);
        }
      };

      const handleSelectAllParticipants = () => {
        if (selectedParticipants.length === friends.length) {
          setSelectedParticipants([]);
        } else {
          setSelectedParticipants(friends.map(f => f.id));
        }
      };

      const handleAddExpense = (e) => {
        e.preventDefault();
        const numAmount = parseFloat(expenseAmount);
        if (!expenseTitle.trim() || isNaN(numAmount) || numAmount <= 0 || !expensePayerId || selectedParticipants.length === 0) {
          return;
        }

        const newExpense = {
          id: Date.now().toString(),
          title: expenseTitle.trim(),
          amount: numAmount,
          payerId: expensePayerId,
          participantIds: [...selectedParticipants],
        };

        setExpenses([...expenses, newExpense]);
        setExpenseTitle('');
        setExpenseAmount('');
        setSelectedParticipants(friends.map(f => f.id));
      };

      const handleDeleteExpense = (id) => {
        setExpenses(expenses.filter(e => e.id !== id));
      };

      // คำนวณยอดหาร
      const calculations = useMemo(() => {
        const friendTotals = {};
        friends.forEach(f => {
          friendTotals[f.id] = {
            id: f.id,
            name: f.name,
            headcount: f.headcount,
            paid: 0,
            shouldPay: 0,
            netBalance: 0,
          };
        });

        let totalExpenseAmount = 0;

        expenses.forEach(exp => {
          totalExpenseAmount += exp.amount;

          if (friendTotals[exp.payerId]) {
            friendTotals[exp.payerId].paid += exp.amount;
          }

          let totalHeadcountForExpense = 0;
          exp.participantIds.forEach(pId => {
            if (friendTotals[pId]) {
              totalHeadcountForExpense += friendTotals[pId].headcount;
            }
          });

          if (totalHeadcountForExpense > 0) {
            const costPerHead = exp.amount / totalHeadcountForExpense;
            exp.participantIds.forEach(pId => {
              if (friendTotals[pId]) {
                friendTotals[pId].shouldPay += costPerHead * friendTotals[pId].headcount;
              }
            });
          }
        });

        Object.values(friendTotals).forEach(f => {
          f.netBalance = f.paid - f.shouldPay;
        });

        const debtors = [];
        const creditors = [];

        Object.values(friendTotals).forEach(f => {
          if (f.netBalance < -0.01) {
            debtors.push({ ...f, amountOwed: Math.abs(f.netBalance) });
          } else if (f.netBalance > 0.01) {
            creditors.push({ ...f, amountToReceive: f.netBalance });
          }
        });

        debtors.sort((a, b) => b.amountOwed - a.amountOwed);
        creditors.sort((a, b) => b.amountToReceive - a.amountToReceive);

        const settlements = [];
        let i = 0, j = 0;

        while (i < debtors.length && j < creditors.length) {
          const debtor = debtors[i];
          const creditor = creditors[j];
          const settlementAmount = Math.min(debtor.amountOwed, creditor.amountToReceive);

          if (settlementAmount > 0.01) {
            settlements.push({
              fromId: debtor.id,
              fromName: debtor.name,
              toId: creditor.id,
              toName: creditor.name,
              amount: settlementAmount,
            });
          }

          debtor.amountOwed -= settlementAmount;
          creditor.amountToReceive -= settlementAmount;

          if (debtor.amountOwed < 0.01) i++;
          if (creditor.amountToReceive < 0.01) j++;
        }

        return {
          friendTotals: Object.values(friendTotals),
          settlements,
          totalExpenseAmount,
        };
      }, [friends, expenses]);

      // สรุปข้อความ
      const generateSummaryText = () => {
        let summaryText = `🧾 *สรุปยอดหารค่าใช้จ่าย*\n`;
        summaryText += `💰 ยอดรวมทั้งหมด: ${calculations.totalExpenseAmount.toLocaleString()} บาท\n\n`;
        
        summaryText += `👥 *รายละเอียดต่อคน/ครอบครัว:*\n`;
        calculations.friendTotals.forEach(f => {
          summaryText += `- ${f.name} (${f.headcount} คน): จ่ายแล้ว ${f.paid.toLocaleString()} บ. | ค่าใช้จ่ายจริง ${f.shouldPay.toLocaleString('th-TH', { maximumFractionDigits: 2 })} บ.\n`;
        });

        summaryText += `\n💸 *สรุปการโอนเงิน (ใครโอนให้ใคร):*\n`;
        if (calculations.settlements.length === 0) {
          summaryText += `✨ เคลียร์ยอดครบแล้ว ไม่มีใครต้องโอนเพิ่ม!\n`;
        } else {
          calculations.settlements.forEach(s => {
            summaryText += `- 👉 ${s.fromName} โอนให้ ${s.toName} : *${s.amount.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} บาท*\n`;
          });
        }
        return summaryText;
      };

      // ----------------------------------------------------
      // 3. บันทึกทริปลง Cloud Firestore
      // ----------------------------------------------------
      const handleSaveToCloud = async () => {
        if (!user) {
          alert("กรุณาเข้าสู่ระบบด้วย Google ก่อนบันทึกประวัติครับ");
          return;
        }
        if (expenses.length === 0) {
          alert("ยังไม่มีรายการค่าใช้จ่ายให้บันทึก");
          return;
        }

        setSaving(true);
        try {
          await db.collection("users").doc(user.uid).collection("trips").add({
            date: new Date().toLocaleString('th-TH'),
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            totalAmount: calculations.totalExpenseAmount,
            summaryText: generateSummaryText(),
            friendsCount: friends.length,
            expensesCount: expenses.length
          });
          alert("☁️ บันทึกประวัติลง Cloud เรียบร้อยแล้ว!");
        } catch (err) {
          alert("เกิดข้อผิดพลาดในการบันทึก: " + err.message);
        } finally {
          setSaving(false);
        }
      };

      // ลบประวัติใน Cloud
      const handleDeleteHistoryRecord = async (tripId) => {
        if (!user) return;
        if (confirm("คุณต้องการลบประวัตินี้หรือไม่?")) {
          await db.collection("users").doc(user.uid).collection("trips").doc(tripId).delete();
        }
      };

      const handleCopySummary = async () => {
        const summaryText = generateSummaryText();
        try {
          await navigator.clipboard.writeText(summaryText);
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        } catch (err) {
          alert("คัดลอกไม่สำเร็จ โปรดคัดลอกด้วยตนเอง");
        }
      };

      const confirmReset = () => {
        setFriends([]);
        setExpenses([]);
        setShowResetModal(false);
      };

      return (
        <div className="min-h-screen pb-16">
          {/* Header */}
          <header className="bg-slate-800 border-b border-slate-700 sticky top-0 z-40 backdrop-blur-md bg-opacity-90">
            <div className="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="p-2.5 bg-emerald-500/20 text-emerald-400 rounded-xl border border-emerald-500/30">
                  <Icon name="pie-chart" className="w-6 h-6" />
                </div>
                <div>
                  <h1 className="text-xl font-bold bg-gradient-to-r from-emerald-400 to-teal-300 bg-clip-text text-transparent">
                    หารค่าใช้จ่ายทริปเพื่อน
                  </h1>
                  <p className="text-xs text-slate-400">คำนวณหารค่าใช้จ่าย + เซฟประวัติผ่าน Google</p>
                </div>
              </div>

              {/* Login / Profile Section */}
              <div className="flex items-center gap-3">
                {loading ? (
                  <span className="text-xs text-slate-400">กำลังโหลด...</span>
                ) : user ? (
                  <div className="flex items-center gap-2">
                    <img src={user.photoURL} alt={user.displayName} className="w-8 h-8 rounded-full border border-emerald-400" />
                    <button 
                      onClick={() => setShowHistoryModal(true)}
                      className="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded-lg transition-colors flex items-center gap-1.5 text-xs font-medium"
                    >
                      <Icon name="history" className="w-4 h-4 text-amber-400" />
                      <span>ประวัติ ({history.length})</span>
                    </button>
                    <button onClick={handleLogout} className="text-xs text-slate-400 hover:text-rose-400 underline">
                      ออก
                    </button>
                  </div>
                ) : (
                  <button 
                    onClick={handleGoogleLogin}
                    className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-3 py-2 rounded-xl flex items-center gap-2 transition-all shadow-lg"
                  >
                    <Icon name="log-in" className="w-4 h-4" /> Sign in with Google
                  </button>
                )}

                <button 
                  onClick={() => setShowResetModal(true)}
                  className="text-slate-400 hover:text-rose-400 p-2 rounded-lg hover:bg-slate-700/50 transition-colors flex items-center gap-1 text-xs"
                  title="ล้างข้อมูลทั้งหมด"
                >
                  <Icon name="rotate-ccw" className="w-4 h-4" />
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-5xl mx-auto px-4 pt-6 space-y-8">
            {/* Step 1: Manage Friends */}
            <section className="bg-slate-800/80 border border-slate-700/80 rounded-2xl p-5 shadow-xl">
              <div className="flex items-center justify-between mb-4">
                <div className="flex items-center gap-2">
                  <div className="w-7 h-7 rounded-lg bg-indigo-500/20 text-indigo-400 flex items-center justify-center font-bold text-sm">1</div>
                  <h2 className="text-lg font-semibold flex items-center gap-2">
                    <Icon name="users" className="w-5 h-5 text-indigo-400" /> รายชื่อเพื่อน & จำนวนคน
                  </h2>
                </div>
                <span className="text-xs bg-slate-700 text-slate-300 px-2.5 py-1 rounded-full font-medium">
                  รวม {friends.reduce((acc, f) => acc + f.headcount, 0)} คน ({friends.length} กลุ่ม)
                </span>
              </div>

              <form onSubmit={handleAddFriend} className="grid grid-cols-1 sm:grid-cols-12 gap-3 mb-5">
                <div className="sm:col-span-6">
                  <input
                    type="text"
                    placeholder="ชื่อเพื่อน หรือ ชื่อกลุ่มครอบครัว..."
                    value={newFriendName}
                    onChange={(e) => setNewFriendName(e.target.value)}
                    className="w-full bg-slate-900 border border-slate-700 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 rounded-xl px-4 py-2.5 text-sm outline-none"
                  />
                </div>
                <div className="sm:col-span-4 flex items-center bg-slate-900 border border-slate-700 rounded-xl px-3 py-1">
                  <span className="text-xs text-slate-400 whitespace-nowrap mr-2">รับผิดชอบ:</span>
                  <button type="button" onClick={() => setNewFriendHeadcount(Math.max(1, newFriendHeadcount - 1))} className="w-7 h-7 rounded-lg bg-slate-800 text-slate-300 flex items-center justify-center font-bold text-sm">-</button>
                  <span className="flex-1 text-center font-semibold text-sm text-indigo-300">{newFriendHeadcount} คน</span>
                  <button type="button" onClick={() => setNewFriendHeadcount(newFriendHeadcount + 1)} className="w-7 h-7 rounded-lg bg-slate-800 text-slate-300 flex items-center justify-center font-bold text-sm">+</button>
                </div>
                <div className="sm:col-span-2">
                  <button type="submit" disabled={!newFriendName.trim()} className="w-full h-full bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white font-medium py-2.5 px-4 rounded-xl text-sm flex items-center justify-center gap-1.5 shadow-lg">
                    <Icon name="user-plus" className="w-4 h-4" /> เพิ่ม
                  </button>
                </div>
              </form>

              {friends.length === 0 ? (
                <div className="text-center py-6 text-slate-500 border border-dashed border-slate-700/60 rounded-xl text-sm">
                  ยังไม่มีรายชื่อเพื่อน กดเพิ่มรายชื่อเพื่อนด้านบนได้เลย
                </div>
              ) : (
                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                  {friends.map((friend) => (
                    <div key={friend.id} className="bg-slate-900/80 border border-slate-700/60 rounded-xl p-3 flex items-center justify-between">
                      <div className="overflow-hidden mr-2">
                        <p className="font-medium text-slate-200 text-sm truncate">{friend.name}</p>
                        <p className="text-xs text-indigo-400">หาร {friend.headcount} คน</p>
                      </div>
                      <div className="flex items-center gap-1.5 shrink-0">
                        <div className="flex items-center bg-slate-800 border border-slate-700 rounded-lg">
                          <button onClick={() => handleUpdateHeadcount(friend.id, -1)} className="w-6 h-6 text-slate-400 flex items-center justify-center font-bold text-xs">-</button>
                          <span className="text-xs font-semibold px-1.5 text-slate-300">{friend.headcount}</span>
                          <button onClick={() => handleUpdateHeadcount(friend.id, 1)} className="w-6 h-6 text-slate-400 flex items-center justify-center font-bold text-xs">+</button>
                        </div>
                        <button onClick={() => handleDeleteFriend(friend.id)} className="p-1.5 text-slate-500 hover:text-rose-400">
                          <Icon name="trash-2" className="w-4 h-4" />
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </section>

            {/* Step 2: Expenses */}
            <section className="bg-slate-800/80 border border-slate-700/80 rounded-2xl p-5 shadow-xl">
              <div className="flex items-center gap-2 mb-4">
                <div className="w-7 h-7 rounded-lg bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-bold text-sm">2</div>
                <h2 className="text-lg font-semibold flex items-center gap-2">
                  <Icon name="receipt" className="w-5 h-5 text-emerald-400" /> บันทึกรายการค่าใช้จ่าย
                </h2>
              </div>

              <form onSubmit={handleAddExpense} className="space-y-4">
                <div className="grid grid-cols-1 sm:grid-cols-12 gap-3">
                  <div className="sm:col-span-5">
                    <label className="block text-xs font-medium text-slate-400 mb-1">รายการซื้อ / ค่าใช้จ่าย</label>
                    <input type="text" placeholder="เช่น ค่าอาหารเย็น" value={expenseTitle} onChange={(e) => setExpenseTitle(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm outline-none" />
                  </div>
                  <div className="sm:col-span-3">
                    <label className="block text-xs font-medium text-slate-400 mb-1">จำนวนเงิน (บาท)</label>
                    <input type="number" step="any" placeholder="0.00" value={expenseAmount} onChange={(e) => setExpenseAmount(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm outline-none font-mono" />
                  </div>
                  <div className="sm:col-span-4">
                    <label className="block text-xs font-medium text-slate-400 mb-1">ใครเป็นคนออกเงินก่อน?</label>
                    <select value={expensePayerId} onChange={(e) => setExpensePayerId(e.target.value)} disabled={friends.length === 0} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm outline-none text-slate-200">
                      {friends.length === 0 ? <option value="">โปรดเพิ่มชื่อเพื่อนก่อน</option> : friends.map(f => <option key={f.id} value={f.id}>{f.name} (สำรองจ่าย)</option>)}
                    </select>
                  </div>
                </div>

                <div className="pt-2">
                  <div className="flex items-center justify-between mb-2">
                    <label className="text-xs font-medium text-slate-300">ใครร่วมหารในรายการนี้บ้าง?</label>
                    {friends.length > 0 && <button type="button" onClick={handleSelectAllParticipants} className="text-xs text-emerald-400 hover:underline">{selectedParticipants.length === friends.length ? 'ยกเลิกทั้งหมด' : 'เลือกทุกคน'}</button>}
                  </div>
                  <div className="flex flex-wrap gap-2">
                    {friends.map((friend) => {
                      const isSelected = selectedParticipants.includes(friend.id);
                      return (
                        <button key={friend.id} type="button" onClick={() => handleToggleParticipant(friend.id)} className={`px-3 py-1.5 rounded-xl text-xs font-medium flex items-center gap-1.5 border ${isSelected ? 'bg-emerald-500/15 border-emerald-500/50 text-emerald-300' : 'bg-slate-900/50 border-slate-700 text-slate-500'}`}>
                          <Icon name={isSelected ? "check-square" : "square"} className="w-3.5 h-3.5" />
                          <span>{friend.name}</span>
                        </button>
                      );
                    })}
                  </div>
                </div>

                <button type="submit" disabled={!expenseTitle.trim() || !expenseAmount || !expensePayerId || selectedParticipants.length === 0} className="w-full bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white font-medium py-2.5 px-4 rounded-xl text-sm flex items-center justify-center gap-2 shadow-lg">
                  <Icon name="plus" className="w-4 h-4" /> เพิ่มรายการจ่าย
                </button>
              </form>

              <div className="mt-6 border-t border-slate-700/60 pt-4">
                <h3 className="text-sm font-semibold text-slate-300 mb-3 flex items-center justify-between">
                  <span>รายการที่บันทึกแล้ว ({expenses.length})</span>
                  <span className="text-xs text-slate-400 font-normal">ยอดรวม: <strong className="text-emerald-400 font-mono">{calculations.totalExpenseAmount.toLocaleString()}</strong> บาท</span>
                </h3>
                <div className="space-y-2.5 max-h-80 overflow-y-auto">
                  {expenses.map((exp) => {
                    const payer = friends.find(f => f.id === exp.payerId);
                    return (
                      <div key={exp.id} className="bg-slate-900/60 border border-slate-700/50 rounded-xl p-3 flex items-center justify-between">
                        <div>
                          <p className="font-medium text-slate-200 text-sm">{exp.title} - <span className="text-emerald-400 font-mono">฿{exp.amount.toLocaleString()}</span></p>
                          <p className="text-xs text-slate-400">จ่ายโดย: {payer ? payer.name : 'ไม่ระบุ'}</p>
                        </div>
                        <button onClick={() => handleDeleteExpense(exp.id)} className="text-xs text-slate-500 hover:text-rose-400 p-1.5">
                          <Icon name="trash-2" className="w-4 h-4" />
                        </button>
                      </div>
                    );
                  })}
                </div>
              </div>
            </section>

            {/* Results Section */}
            <section className="grid grid-cols-1 md:grid-cols-12 gap-6">
              <div className="md:col-span-6 bg-slate-800/80 border border-slate-700/80 rounded-2xl p-5 shadow-xl">
                <h2 className="text-lg font-semibold flex items-center gap-2 mb-4">
                  <Icon name="dollar-sign" className="w-5 h-5 text-teal-400" /> สรุปยอดรายคน
                </h2>
                <div className="space-y-2.5">
                  {calculations.friendTotals.map((f) => (
                    <div key={f.id} className="bg-slate-900/80 border border-slate-700/60 rounded-xl p-3 flex items-center justify-between text-xs">
                      <div>
                        <p className="font-semibold text-slate-200 text-sm">{f.name}</p>
                        <p className="text-slate-400">หาร {f.headcount} คน | จ่ายไป {f.paid.toLocaleString()} บ.</p>
                      </div>
                      <p className={`font-mono font-bold ${f.netBalance > 0.01 ? 'text-emerald-400' : f.netBalance < -0.01 ? 'text-rose-400' : 'text-slate-400'}`}>
                        {f.netBalance > 0.01 ? `+รับคืน ${f.netBalance.toLocaleString('th-TH', { maximumFractionDigits: 1 })}` : f.netBalance < -0.01 ? `ต้องจ่าย ${Math.abs(f.netBalance).toLocaleString('th-TH', { maximumFractionDigits: 1 })}` : 'สมดุล (0)'}
                      </p>
                    </div>
                  ))}
                </div>
              </div>

              <div className="md:col-span-6 bg-slate-800/80 border border-slate-700/80 rounded-2xl p-5 shadow-xl flex flex-col justify-between">
                <div>
                  <h2 className="text-lg font-semibold flex items-center gap-2 mb-4 text-amber-300">
                    <Icon name="sparkles" className="w-5 h-5 text-amber-400" /> สรุปการโอนเงิน
                  </h2>
                  <div className="space-y-3 mb-4">
                    {calculations.settlements.length === 0 ? (
                      <div className="text-center py-6 bg-slate-900/50 rounded-xl text-slate-400 text-sm">🎉 เคลียร์ยอดเรียบร้อยแล้ว!</div>
                    ) : (
                      calculations.settlements.map((s, index) => (
                        <div key={index} className="bg-slate-900 border border-amber-500/30 rounded-xl p-3 flex items-center justify-between">
                          <span className="font-semibold text-rose-300 text-sm">{s.fromName} 👉 {s.toName}</span>
                          <span className="font-mono font-bold text-amber-400">฿{s.amount.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</span>
                        </div>
                      ))
                    )}
                  </div>
                </div>

                <div className="space-y-2">
                  <button
                    onClick={handleSaveToCloud}
                    disabled={saving || expenses.length === 0}
                    className="w-full bg-slate-700 hover:bg-slate-600 disabled:opacity-50 text-slate-200 py-2.5 px-4 rounded-xl text-xs font-semibold flex items-center justify-center gap-2 transition-all border border-slate-600"
                  >
                    <Icon name="cloud-upload" className="w-4 h-4 text-amber-400" />
                    {saving ? "กำลังบันทึก..." : "บันทึกทริปนี้เข้า Cloud Database"}
                  </button>

                  <button
                    onClick={handleCopySummary}
                    disabled={expenses.length === 0}
                    className={`w-full py-3 px-4 rounded-xl text-sm font-semibold transition-all flex items-center justify-center gap-2 ${copied ? 'bg-emerald-600 text-white' : 'bg-amber-500 hover:bg-amber-400 text-slate-950 disabled:opacity-50'}`}
                  >
                    <Icon name={copied ? "check" : "copy"} className="w-4 h-4" />
                    {copied ? 'คัดลอกสรุปเรียบร้อย!' : 'คัดลอกสรุปข้อความ (ส่งลงไลน์)'}
                  </button>
                </div>
              </div>
            </section>
          </main>

          {/* History Modal */}
          {showHistoryModal && (
            <div className="fixed inset-0 bg-slate-950/75 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-800 border border-slate-700 rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-2xl max-h-[80vh] flex flex-col">
                <div className="flex items-center justify-between border-b border-slate-700 pb-3">
                  <h3 className="text-lg font-bold text-slate-100 flex items-center gap-2">
                    <Icon name="history" className="w-5 h-5 text-amber-400" /> ประวัติบน Cloud ของคุณ
                  </h3>
                  <button onClick={() => setShowHistoryModal(false)} className="text-slate-400 hover:text-slate-200 text-sm">✕</button>
                </div>

                <div className="overflow-y-auto space-y-3 flex-1 pr-1">
                  {history.length === 0 ? (
                    <p className="text-center text-slate-500 py-8 text-sm">ยังไม่มีประวัติที่ถูกบันทึกไว้</p>
                  ) : (
                    history.map((record) => (
                      <div key={record.id} className="bg-slate-900 border border-slate-700 rounded-xl p-3.5 space-y-2">
                        <div className="flex items-center justify-between text-xs text-slate-400 border-b border-slate-800 pb-2">
                          <span>📅 {record.date}</span>
                          <button onClick={() => handleDeleteHistoryRecord(record.id)} className="text-rose-400 hover:underline">ลบ</button>
                        </div>
                        <p className="text-xs text-slate-300">ยอดรวม: <strong className="text-emerald-400">฿{record.totalAmount?.toLocaleString()}</strong> ({record.friendsCount} กลุ่ม / {record.expensesCount} รายการ)</p>
                        <pre className="text-[11px] font-mono bg-slate-950 p-2 rounded border border-slate-800 text-slate-300 overflow-x-auto whitespace-pre-wrap">
                          {record.summaryText}
                        </pre>
                      </div>
                    ))
                  )}
                </div>

                <button onClick={() => setShowHistoryModal(false)} className="w-full py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-xl text-xs font-semibold">
                  ปิดหน้าต่าง
                </button>
              </div>
            </div>
          )}

          {/* Reset Modal */}
          {showResetModal && (
            <div className="fixed inset-0 bg-slate-950/75 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-800 border border-slate-700 rounded-2xl max-w-sm w-full p-6 space-y-4 shadow-2xl">
                <h3 className="text-lg font-bold text-slate-100">ยืนยันการรีเซ็ตข้อมูล?</h3>
                <p className="text-sm text-slate-300">ข้อมูลปัจจุบันในหน้านี้จะถูกลบทั้งหมด (ไม่มีผลกับประวัติที่เคยเซฟไว้)</p>
                <div className="flex gap-3 pt-2">
                  <button onClick={() => setShowResetModal(false)} className="flex-1 px-4 py-2 bg-slate-700 text-slate-200 rounded-xl text-sm font-medium">ยกเลิก</button>
                  <button onClick={confirmReset} className="flex-1 px-4 py-2 bg-rose-600 text-white rounded-xl text-sm font-medium">ลบทั้งหมด</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
