<html lang="th" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Lucide Icons CDN -->

  <!-- Firebase SDKs (Compat version for HTML script import) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

<body class="bg-slate-100 text-slate-800 dark:bg-slate-900 dark:text-slate-100 font-sans min-h-screen transition-colors duration-200">

  <div id="root"></div>

  <script type="text/babel">
    // ----------------------------------------------------
    // Firebase Configuration
    // ----------------------------------------------------
    const firebaseConfig = {
      apiKey: "AIzaSyCwvoRRmlGk6C-S2PbsZbkm2P5B2E98Hks",
      authDomain: "trip-expense-calculator-9261b.firebaseapp.com",
      projectId: "trip-expense-calculator-9261b",
      storageBucket: "trip-expense-calculator-9261b.firebasestorage.app",
      messagingSenderId: "211000271288",
      appId: "1:211000271288:web:e76cc31d65834a09db6f4d",
      measurementId: "G-N4DE2DLX4W"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();
    const storage = firebase.storage ? firebase.storage() : null;

    const { useState, useMemo, useEffect, useRef } = React;

    const Icon = ({ name, className = "w-4 h-4" }) => {
      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [name]);
      return (
        <span key={name} className="inline-flex items-center justify-center shrink-0">
          <i data-lucide={name} className={className}></i>
        </span>
      );
    };

    const POPULAR_CATEGORIES = [
      { label: "🍲 ค่าอาหาร", title: "ค่าอาหาร" },
      { label: "🍻 ค่าเครื่องดื่ม/เบียร์", title: "ค่าเครื่องดื่ม/เบียร์" },
      { label: "🚗 ค่าน้ำมัน/ค่ารถ", title: "ค่าน้ำมัน/ค่าเดินทาง" },
      { label: "🏨 ค่าที่พัก/โรงแรม", title: "ค่าที่พัก" },
      { label: "☕ ค่าคาเฟ่/ของว่าง", title: "ค่ากาแฟ/ขนม" },
      { label: "🎫 ค่าบัตร/ค่าเข้าชม", title: "ค่าตั๋ว/กิจกรรม" },
      { label: "🛒 ของใช้ส่วนกลาง", title: "ของใช้ส่วนกลาง" }
    ];

    const getTodayDateString = () => {
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    };

    const compressImageFile = (file, maxWidth = 900, quality = 0.65) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
        };
        reader.onerror = reject;
      });
    };

    function App() {
      // Theme State
      const [isDarkMode, setIsDarkMode] = useState(() => {
        const savedTheme = localStorage.getItem('trip_theme');
        return savedTheme ? savedTheme === 'dark' : true;
      });

      useEffect(() => {
        if (isDarkMode) {
          document.documentElement.classList.add('dark');
          localStorage.setItem('trip_theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          localStorage.setItem('trip_theme', 'light');
        }
      }, [isDarkMode]);

      // User Auth State
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);

      const getDefaultTripName = () => {
        const today = new Date();
        return `ทริปวันที่ ${today.toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' })}`;
      };

      const [currentTripId, setCurrentTripId] = useState(null);
      const [tripName, setTripName] = useState(getDefaultTripName());

      // Data States
      const [friends, setFriends] = useState([]);
      const [expenses, setExpenses] = useState([]);
      const [history, setHistory] = useState([]);

      // Saved Friends (สมุดรายชื่อเพื่อนถาวร)
      const [savedFriends, setSavedFriends] = useState(() => {
        try {
          const local = localStorage.getItem('trip_saved_friends');
          return local ? JSON.parse(local) : [];
        } catch {
          return [];
        }
      });
      const [showSavedFriendsModal, setShowSavedFriendsModal] = useState(false);
      const [manageFriendName, setManageFriendName] = useState('');
      const [manageFriendPP, setManageFriendPP] = useState('');
      const [editingSavedFriendId, setEditingSavedFriendId] = useState(null);

      // Inputs state: Add Friend + Autocomplete Dropdown
      const [newFriendName, setNewFriendName] = useState('');
      const [newFriendPromptPay, setNewFriendPromptPay] = useState('');
      const [newFriendHeadcount, setNewFriendHeadcount] = useState(1);
      const [showFriendDropdown, setShowFriendDropdown] = useState(false);
      const dropdownWrapperRef = useRef(null);

      // Inline Edit State for Friends in Current Trip
      const [editingTripFriendId, setEditingTripFriendId] = useState(null);
      const [editTripFriendName, setEditTripFriendName] = useState('');
      const [editTripFriendPP, setEditTripFriendPP] = useState('');
      const [editTripFriendHeadcount, setEditTripFriendHeadcount] = useState(1);

      // Inputs state: Expenses & Edit Mode
      const [editingExpenseId, setEditingExpenseId] = useState(null);
      const [expenseDate, setExpenseDate] = useState(getTodayDateString());
      const [expenseTitle, setExpenseTitle] = useState('');
      const [expenseAmount, setExpenseAmount] = useState('');
      const [expensePayerId, setExpensePayerId] = useState('');
      const [selectedParticipants, setSelectedParticipants] = useState([]);
      
      // Receipt States
      const [receiptFile, setReceiptFile] = useState(null);
      const [receiptPreview, setReceiptPreview] = useState(null);
      const [uploading, setUploading] = useState(false);
      const [viewingReceiptUrl, setViewingReceiptUrl] = useState(null);
      const fileInputRef = useRef(null);
      const expenseSectionRef = useRef(null);
      
      // UI Modals & Feedback
      const [copied, setCopied] = useState(false);
      const [showResetModal, setShowResetModal] = useState(false);
      const [showHistoryModal, setShowHistoryModal] = useState(false);
      const [saving, setSaving] = useState(false);
      const [alertMsg, setAlertMsg] = useState(null);

      const showAlert = (message, type = 'info') => {
        setAlertMsg({ message, type });
        setTimeout(() => setAlertMsg(null), 4000);
      };

      // ปิด Dropdown รายชื่อเมื่อคลิกพื้นที่อื่น
      useEffect(() => {
        const handleClickOutside = (event) => {
          if (dropdownWrapperRef.current && !dropdownWrapperRef.current.contains(event.target)) {
            setShowFriendDropdown(false);
          }
        };
        document.addEventListener("mousedown", handleClickOutside);
        return () => document.removeEventListener("mousedown", handleClickOutside);
      }, []);

      // Auth Listener & Fetch Cloud Data
      useEffect(() => {
        let unsubscribeHistory = null;
        let unsubscribeUser = null;

        const unsubscribeAuth = auth.onAuthStateChanged((currentUser) => {
          setUser(currentUser);
          setLoading(false);

          if (unsubscribeHistory) unsubscribeHistory();
          if (unsubscribeUser) unsubscribeUser();

          if (currentUser) {
            const historyRef = db.collection("users").doc(currentUser.uid).collection("trips");
            unsubscribeHistory = historyRef.orderBy("createdAt", "desc").onSnapshot((snapshot) => {
              setHistory(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
            });

            unsubscribeUser = db.collection("users").doc(currentUser.uid).onSnapshot(doc => {
              if (doc.exists && doc.data().savedFriends) {
                setSavedFriends(doc.data().savedFriends);
                localStorage.setItem('trip_saved_friends', JSON.stringify(doc.data().savedFriends));
              }
            });
          } else {
            setHistory([]);
            const local = localStorage.getItem('trip_saved_friends');
            if (local) setSavedFriends(JSON.parse(local));
          }
        });

        return () => {
          if (unsubscribeHistory) unsubscribeHistory();
          if (unsubscribeUser) unsubscribeUser();
          unsubscribeAuth();
        };
      }, []);

      const handleGoogleLogin = async () => {
        const provider = new firebase.auth.GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        try {
          await auth.signInWithPopup(provider);
          showAlert("เข้าสู่ระบบสำเร็จ!", "success");
        } catch (error) {
          showAlert(`เข้าสู่ระบบไม่สำเร็จ: ${error.message}`, "error");
        }
      };

      const handleLogout = async () => {
        try {
          await auth.signOut();
          showAlert("ออกจากระบบเรียบร้อยแล้ว", "info");
        } catch (err) {
          showAlert("ออกจากระบบไม่สำเร็จ: " + err.message, "error");
        }
      };

      useEffect(() => {
        if ((!expensePayerId || !friends.some(f => f.id === expensePayerId)) && friends.length > 0) {
          setExpensePayerId(friends[0].id);
        } else if (friends.length === 0) {
          setExpensePayerId('');
        }
      }, [friends, expensePayerId]);

      // -----------------------------------------------------
      // บันทึก / อัปเดต สมุดรายชื่อถาวร (Sync LocalStorage & Cloud)
      // -----------------------------------------------------
      const persistSavedFriends = async (updatedList) => {
        setSavedFriends(updatedList);
        localStorage.setItem('trip_saved_friends', JSON.stringify(updatedList));
        if (user) {
          try {
            await db.collection("users").doc(user.uid).set({ savedFriends: updatedList }, { merge: true });
          } catch (err) {
            console.error("Sync savedFriends error:", err);
          }
        }
      };

      const upsertSavedFriend = (name, promptPay, previousName = null) => {
        const trimmedName = name.trim();
        const trimmedPP = (promptPay || '').trim();
        if (!trimmedName) return;

        let updatedList = [...savedFriends];
        const matchKey = (previousName || trimmedName).toLowerCase();
        const existingIndex = updatedList.findIndex(f => f.name.toLowerCase() === matchKey);

        if (existingIndex !== -1) {
          updatedList[existingIndex] = {
            ...updatedList[existingIndex],
            name: trimmedName,
            promptPay: trimmedPP || updatedList[existingIndex].promptPay || ''
          };
        } else {
          updatedList.push({
            id: 'sf_' + Date.now().toString() + Math.random().toString(36).slice(2, 5),
            name: trimmedName,
            promptPay: trimmedPP
          });
        }
        persistSavedFriends(updatedList);
      };

      const handleAddOrUpdateSavedFriend = async (e) => {
        e.preventDefault();
        if (!manageFriendName.trim()) return;
        
        let newList;
        if (editingSavedFriendId) {
          newList = savedFriends.map(f => f.id === editingSavedFriendId ? { ...f, name: manageFriendName.trim(), promptPay: manageFriendPP.trim() } : f);
          showAlert(`อัปเดตข้อมูล "${manageFriendName.trim()}" ในสมุดแล้ว`, "success");
        } else {
          newList = [...savedFriends, { id: 'sf_' + Date.now().toString(), name: manageFriendName.trim(), promptPay: manageFriendPP.trim() }];
          showAlert(`เพิ่ม "${manageFriendName.trim()}" ลงสมุดประจำแล้ว`, "success");
        }
        
        await persistSavedFriends(newList);
        setManageFriendName('');
        setManageFriendPP('');
        setEditingSavedFriendId(null);
      };

      const handleDeleteSavedFriend = (id) => {
        if (window.confirm("ต้องการลบเพื่อนคนนี้ออกจากสมุดรายชื่อประจำหรือไม่?")) {
          const newList = savedFriends.filter(f => f.id !== id);
          persistSavedFriends(newList);
        }
      };

      // -----------------------------------------------------
      // เพิ่ม / เลือก / แก้ไข เพื่อนในทริปปัจจุบัน
      // -----------------------------------------------------
      const handleAddFriendToTrip = (name, promptPay, headcount, shouldRemember = false) => {
        const trimmedName = name.trim();
        if (!trimmedName) return;

        const newFriend = {
          id: 'friend_' + Date.now().toString() + Math.random().toString(36).slice(2, 5),
          name: trimmedName,
          promptPay: (promptPay || '').trim(),
          headcount: Math.max(1, parseInt(headcount) || 1),
        };

        setFriends(prev => [...prev, newFriend]);
        if (!editingExpenseId) {
          setSelectedParticipants(prev => [...prev, newFriend.id]);
        }
        if (!expensePayerId) {
          setExpensePayerId(newFriend.id);
        }

        if (shouldRemember) {
          upsertSavedFriend(trimmedName, promptPay);
        }
      };

      const handleAddFriendSubmit = (e) => {
        e.preventDefault();
        if (!newFriendName.trim()) return;
        handleAddFriendToTrip(newFriendName, newFriendPromptPay, newFriendHeadcount, true);
        setNewFriendName('');
        setNewFriendPromptPay('');
        setNewFriendHeadcount(1);
        setShowFriendDropdown(false);
      };

      const handleAddAllSavedFriendsToTrip = () => {
        const notAddedYet = savedFriends.filter(sf => !friends.some(f => f.name.toLowerCase() === sf.name.toLowerCase()));
        if (notAddedYet.length === 0) return;

        const newFriendsBatch = notAddedYet.map((sf, idx) => ({
          id: 'friend_' + (Date.now() + idx).toString(),
          name: sf.name,
          promptPay: sf.promptPay || '',
          headcount: 1
        }));

        setFriends(prev => [...prev, ...newFriendsBatch]);
        if (!editingExpenseId) {
          setSelectedParticipants(prev => [...prev, ...newFriendsBatch.map(f => f.id)]);
        }
        if (!expensePayerId && newFriendsBatch.length > 0) {
          setExpensePayerId(newFriendsBatch[0].id);
        }
        showAlert(`เพิ่มเพื่อนจากสมุดเข้าทริป ${newFriendsBatch.length} คนเรียบร้อย!`, "success");
      };

      const handleSelectFriendFromDropdown = (sf) => {
        setNewFriendName(sf.name);
        setNewFriendPromptPay(sf.promptPay || '');
        setShowFriendDropdown(false);
      };

      const handleStartEditTripFriend = (friend) => {
        setEditingTripFriendId(friend.id);
        setEditTripFriendName(friend.name);
        setEditTripFriendPP(friend.promptPay || '');
        setEditTripFriendHeadcount(friend.headcount || 1);
      };

      const handleSaveEditTripFriend = (friendId) => {
        if (!editTripFriendName.trim()) {
          showAlert("กรุณาระบุชื่อเพื่อน", "error");
          return;
        }
        const oldFriend = friends.find(f => f.id === friendId);
        const updatedName = editTripFriendName.trim();
        const updatedPP = editTripFriendPP.trim();
        const updatedHeadcount = Math.max(1, parseInt(editTripFriendHeadcount) || 1);

        setFriends(prev => prev.map(f => f.id === friendId ? {
          ...f,
          name: updatedName,
          promptPay: updatedPP,
          headcount: updatedHeadcount
        } : f));

        upsertSavedFriend(updatedName, updatedPP, oldFriend ? oldFriend.name : null);
        setEditingTripFriendId(null);
        showAlert(`บันทึกข้อมูลของ "${updatedName}" เรียบร้อยแล้ว`, "success");
      };

      const handleDeleteFriend = (id) => {
        if (editingTripFriendId === id) setEditingTripFriendId(null);
        setFriends(friends.filter(f => f.id !== id));
        setExpenses(expenses.map(exp => ({
          ...exp,
          participantIds: exp.participantIds.filter(pId => pId !== id),
        })).filter(exp => exp.payerId !== id));
        setSelectedParticipants(selectedParticipants.filter(pId => pId !== id));
      };

      const handleUpdateHeadcount = (id, delta) => {
        setFriends(friends.map(f => f.id === id ? { ...f, headcount: Math.max(1, f.headcount + delta) } : f));
      };

      const handleToggleParticipant = (friendId) => {
        setSelectedParticipants(prev => prev.includes(friendId) ? prev.filter(id => id !== friendId) : [...prev, friendId]);
      };

      const handleSelectAllParticipants = () => {
        setSelectedParticipants(selectedParticipants.length === friends.length ? [] : friends.map(f => f.id));
      };

      const filteredSavedFriends = useMemo(() => {
        const keyword = newFriendName.trim().toLowerCase();
        if (!keyword) return savedFriends;
        return savedFriends.filter(sf =>
          sf.name.toLowerCase().includes(keyword) ||
          (sf.promptPay && sf.promptPay.includes(keyword))
        );
      }, [savedFriends, newFriendName]);

      // ระบบจัดการรูปใบเสร็จ
      const handleReceiptFileChange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) return showAlert("กรุณาเลือกไฟล์รูปภาพเท่านั้น", "error");

        try {
          setReceiptFile(file);
          const compressedDataUrl = await compressImageFile(file);
          setReceiptPreview(compressedDataUrl);
        } catch (err) {
          showAlert("ไม่สามารถอ่านไฟล์รูปภาพนี้ได้", "error");
        }
      };

      const handleClearReceipt = () => {
        setReceiptFile(null);
        setReceiptPreview(null);
        if (fileInputRef.current) fileInputRef.current.value = "";
      };

      const handleStartEditExpense = (exp) => {
        setEditingExpenseId(exp.id);
        setExpenseDate(exp.date || getTodayDateString());
        setExpenseTitle(exp.title);
        setExpenseAmount(exp.amount.toString());
        setExpensePayerId(exp.payerId);
        setSelectedParticipants(exp.participantIds || []);
        setReceiptFile(null);
        setReceiptPreview(exp.receiptUrl || null);
        if (fileInputRef.current) fileInputRef.current.value = "";
        if (expenseSectionRef.current) expenseSectionRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
      };

      const handleCancelEditExpense = () => {
        setEditingExpenseId(null);
        setExpenseDate(getTodayDateString());
        setExpenseTitle('');
        setExpenseAmount('');
        if (friends.length > 0) setExpensePayerId(friends[0].id);
        setSelectedParticipants(friends.map(f => f.id));
        handleClearReceipt();
      };

      // บันทึกรายการค่าใช้จ่าย
      const handleSaveExpenseForm = async (e) => {
        e.preventDefault();
        const numAmount = parseFloat(expenseAmount);
        if (!expenseTitle.trim() || isNaN(numAmount) || numAmount <= 0 || !expensePayerId || selectedParticipants.length === 0) {
          return showAlert("กรุณากรอกข้อมูลรายการ จำนวนเงิน และเลือกคนหารให้ครบถ้วน", "error");
        }

        setUploading(true);
        let finalReceiptUrl = receiptPreview || null;

        if (receiptFile && user && storage) {
          try {
            const fileName = `receipt_${Date.now()}.jpg`;
            const fileRef = storage.ref().child(`receipts/${user.uid}/${fileName}`);
            const uploadTask = fileRef.putString(receiptPreview, 'data_url').then(() => fileRef.getDownloadURL());
            const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error("Storage timeout")), 3500));
            finalReceiptUrl = await Promise.race([uploadTask, timeoutPromise]);
          } catch (err) {
            finalReceiptUrl = receiptPreview;
          }
        }

        const expenseData = {
          date: expenseDate || getTodayDateString(),
          title: expenseTitle.trim(),
          amount: numAmount,
          payerId: expensePayerId,
          participantIds: [...selectedParticipants],
          receiptUrl: finalReceiptUrl
        };

        if (editingExpenseId) {
          setExpenses(prev => prev.map(exp => exp.id === editingExpenseId ? { ...exp, ...expenseData } : exp));
          showAlert(`แก้ไขรายการ "${expenseTitle.trim()}" เรียบร้อยแล้ว!`, "success");
          setEditingExpenseId(null);
        } else {
          setExpenses(prev => [...prev, { id: 'exp_' + Date.now().toString(), createdAtMs: Date.now(), ...expenseData }]);
          showAlert(`เพิ่มรายการ "${expenseTitle.trim()}" เรียบร้อย!`, "success");
        }

        setExpenseTitle('');
        setExpenseAmount('');
        handleClearReceipt();
        setSelectedParticipants(friends.map(f => f.id));
        setUploading(false);
      };

      const handleDeleteExpense = (id) => {
        if (editingExpenseId === id) handleCancelEditExpense();
        setExpenses(expenses.filter(e => e.id !== id));
      };

      const sortedExpenses = useMemo(() => {
        return [...expenses].sort((a, b) => {
          const dateA = a.date || '';
          const dateB = b.date || '';
          if (dateA !== dateB) return dateA.localeCompare(dateB);
          return (a.createdAtMs || 0) - (b.createdAtMs || 0);
        });
      }, [expenses]);

      // คำนวณสรุปยอด
      const calculations = useMemo(() => {
        const friendTotals = {};
        friends.forEach(f => {
          friendTotals[f.id] = { id: f.id, name: f.name, promptPay: f.promptPay || '', headcount: f.headcount, paid: 0, shouldPay: 0, netBalance: 0 };
        });

        let totalExpenseAmount = 0;

        expenses.forEach(exp => {
          totalExpenseAmount += exp.amount;
          if (friendTotals[exp.payerId]) friendTotals[exp.payerId].paid += exp.amount;

          let totalHeadcount = 0;
          exp.participantIds.forEach(pId => { if (friendTotals[pId]) totalHeadcount += friendTotals[pId].headcount; });

          if (totalHeadcount > 0) {
            const costPerHead = exp.amount / totalHeadcount;
            exp.participantIds.forEach(pId => { if (friendTotals[pId]) friendTotals[pId].shouldPay += costPerHead * friendTotals[pId].headcount; });
          }
        });

        Object.values(friendTotals).forEach(f => { f.netBalance = f.paid - f.shouldPay; });

        const debtors = [];
        const creditors = [];

        Object.values(friendTotals).forEach(f => {
          if (f.netBalance < -0.01) debtors.push({ ...f, amountOwed: Math.abs(f.netBalance) });
          else if (f.netBalance > 0.01) creditors.push({ ...f, amountToReceive: f.netBalance });
        });

        debtors.sort((a, b) => b.amountOwed - a.amountOwed);
        creditors.sort((a, b) => b.amountToReceive - a.amountToReceive);

        const settlements = [];
        let i = 0, j = 0;

        while (i < debtors.length && j < creditors.length) {
          const debtor = debtors[i];
          const creditor = creditors[j];
          const settlementAmount = Math.min(debtor.amountOwed, creditor.amountToReceive);

          if (settlementAmount > 0.01) {
            settlements.push({
              fromId: debtor.id, fromName: debtor.name, toId: creditor.id, toName: creditor.name, toPromptPay: creditor.promptPay, amount: settlementAmount,
            });
          }

          debtor.amountOwed -= settlementAmount;
          creditor.amountToReceive -= settlementAmount;

          if (debtor.amountOwed < 0.01) i++;
          if (creditor.amountToReceive < 0.01) j++;
        }

        return { friendTotals: Object.values(friendTotals), settlements, totalExpenseAmount };
      }, [friends, expenses]);

      const formatThaiDate = (dateStr) => {
        if (!dateStr) return 'ไม่ระบุวันที่';
        const parts = dateStr.split('-');
        if (parts.length !== 3) return dateStr;
        const dateObj = new Date(parts[0], parts[1] - 1, parts[2]);
        return dateObj.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' });

            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl max-w-md w-full p-5 space-y-4 shadow-2xl flex flex-col max-h-[85vh]">
                <div className="flex items-center justify-between border-b border-slate-200 dark:border-slate-700 pb-3">
                  <div>
                    <h3 className="text-lg font-bold text-slate-800 dark:text-slate-100 flex items-center gap-2">
                      <Icon name="book-user" className="w-5 h-5 text-indigo-500 dark:text-indigo-400" /> สมุดรายชื่อเพื่อนประจำ
                    </h3>
                    <p className="text-[11px] text-slate-500 dark:text-slate-400">จัดการชื่อและพร้อมเพย์ที่จดจำไว้สำหรับใช้ทุกทริป</p>
                  </div>
                  <button onClick={() => { setShowSavedFriendsModal(false); setEditingSavedFriendId(null); setManageFriendName(''); setManageFriendPP(''); }} className="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-sm p-1">✕</button>
                </div>

                <form onSubmit={handleAddOrUpdateSavedFriend} className="bg-slate-50 dark:bg-slate-900/50 p-3 rounded-xl border border-slate-200 dark:border-slate-700 space-y-3">
                  <h4 className="text-xs font-semibold text-slate-600 dark:text-slate-400">{editingSavedFriendId ? '✏️ แก้ไขข้อมูลเพื่อนในสมุด' : '➕ เพิ่มเพื่อนใหม่ในสมุด'}</h4>
                  <div className="grid grid-cols-2 gap-2">
                    <input type="text" placeholder="ชื่อเพื่อน..." value={manageFriendName} onChange={(e)=>setManageFriendName(e.target.value)} className="w-full bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 focus:border-indigo-500 rounded-xl px-3 py-2 text-sm outline-none" required />
                    <input type="text" placeholder="พร้อมเพย์ (ถ้ามี)" value={manageFriendPP} onChange={(e)=>setManageFriendPP(e.target.value)} className="w-full bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 focus:border-indigo-500 rounded-xl px-3 py-2 text-sm font-mono outline-none" />
                  </div>
                  <div className="flex gap-2">
                    <button type="submit" disabled={!manageFriendName.trim()} className="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 rounded-xl text-xs shadow-sm transition-colors">
                      {editingSavedFriendId ? 'บันทึกการแก้ไข' : 'เพิ่มลงสมุดถาวร'}
                    </button>
                    {editingSavedFriendId && (
                      <button type="button" onClick={() => {setEditingSavedFriendId(null); setManageFriendName(''); setManageFriendPP('');}} className="px-3 bg-slate-200 hover:bg-slate-300 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-300 rounded-xl text-xs font-medium transition-colors">ยกเลิก</button>
                    )}
                  </div>
                </form>

                <div className="overflow-y-auto space-y-2 flex-1 pr-1">
                  {savedFriends.length === 0 ? (
                    <div className="text-center py-8 text-slate-400 dark:text-slate-500 text-xs">ยังไม่มีเพื่อนในสมุดรายชื่อ</div>
                  ) : (
                    savedFriends.map(sf => {
                      const isAdded = friends.some(f => f.name.toLowerCase() === sf.name.toLowerCase());
                      return (
                        <div key={sf.id} className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl p-2.5 flex items-center justify-between shadow-sm">
                          <div className="overflow-hidden mr-2">
                            <p className="font-semibold text-slate-800 dark:text-slate-200 text-sm truncate">{sf.name}</p>
                            {sf.promptPay ? (
                              <p className="text-[11px] text-emerald-600 dark:text-emerald-400 font-mono mt-0.5">💳 PP: {sf.promptPay}</p>
                            ) : (
                              <p className="text-[10px] text-slate-400 mt-0.5">ไม่มีเลขพร้อมเพย์</p>
                            )}
                          </div>
                          <div className="flex items-center gap-1 shrink-0">
                            <button
                              type="button"
                              disabled={isAdded}
                              onClick={() => handleAddFriendToTrip(sf.name, sf.promptPay || '', 1, false)}
                              className={`px-2 py-1 rounded-lg text-[11px] font-medium transition-colors ${
                                isAdded
                                  ? 'bg-slate-100 dark:bg-slate-700 text-slate-400 cursor-not-allowed'
                                  : 'bg-emerald-500/15 text-emerald-600 dark:text-emerald-300 hover:bg-emerald-500/25'
                              }`}
                            >
                              {isAdded ? 'เพิ่มแล้ว' : '+ ดึงเข้าทริป'}
                            </button>
                            <button type="button" onClick={() => { setEditingSavedFriendId(sf.id); setManageFriendName(sf.name); setManageFriendPP(sf.promptPay || ''); }} className="p-1.5 text-slate-400 hover:text-amber-500 dark:hover:text-amber-400 transition-colors" title="แก้ไข"><Icon name="edit-2" className="w-3.5 h-3.5"/></button>
                            <button type="button" onClick={() => handleDeleteSavedFriend(sf.id)} className="p-1.5 text-slate-400 hover:text-rose-500 transition-colors" title="ลบ"><Icon name="trash-2" className="w-3.5 h-3.5"/></button>
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>
              </div>
            </div>
          )}

          {/* Modal ดูรูปใบเสร็จ */}
          {viewingReceiptUrl && (
            <div className="fixed inset-0 bg-slate-950/85 backdrop-blur-sm flex items-center justify-center p-4 z-50" onClick={() => setViewingReceiptUrl(null)}>
              <div className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl max-w-lg w-full p-4 space-y-3 shadow-2xl" onClick={(e) => e.stopPropagation()}>
                <div className="flex items-center justify-between border-b border-slate-200 dark:border-slate-700 pb-2">
                  <h3 className="text-sm font-bold flex items-center gap-2"><Icon name="image" className="w-4 h-4 text-emerald-500" /> รูปใบเสร็จ / สลิป</h3>
                  <button onClick={() => setViewingReceiptUrl(null)} className="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-sm px-2">✕</button>
                </div>
                <div className="max-h-[70vh] overflow-auto flex justify-center bg-slate-100 dark:bg-slate-900 rounded-xl p-2">
                  <img src={viewingReceiptUrl} alt="Receipt" className="max-w-full h-auto rounded-lg object-contain" />
                </div>
                <div className="flex justify-end gap-2">
                  <a href={viewingReceiptUrl} download={`receipt_${Date.now()}.jpg`} className="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-semibold flex items-center gap-1">ดาวน์โหลดรูป</a>
                  <button onClick={() => setViewingReceiptUrl(null)} className="px-4 py-1.5 bg-slate-200 dark:bg-slate-700 text-slate-800 dark:text-slate-200 rounded-xl text-xs font-semibold">ปิด</button>
                </div>
              </div>
            </div>
          )}

          {/* History Modal */}
          {showHistoryModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl max-w-xl w-full p-6 space-y-4 shadow-2xl max-h-[85vh] flex flex-col">
                <div className="flex items-center justify-between border-b border-slate-200 dark:border-slate-700 pb-3">
                  <h3 className="text-lg font-bold text-slate-800 dark:text-slate-100 flex items-center gap-2"><Icon name="folder-clock" className="w-5 h-5 text-amber-500 dark:text-amber-400" /> ประวัติทริปบน Cloud</h3>
                  <button onClick={() => setShowHistoryModal(false)} className="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-sm p-1">✕</button>
                </div>
                <div className="overflow-y-auto space-y-3 flex-1 pr-1">
                  {history.length === 0 ? <div className="text-center py-12 text-slate-400 text-sm">ยังไม่มีประวัติทริป</div> : history.map((record) => (
                    <div key={record.id} className="bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700/80 rounded-xl p-3.5 space-y-2">
                      <div className="flex items-start justify-between border-b border-slate-200 dark:border-slate-800 pb-2">
                        <div>
                          <h4 className="font-bold text-amber-600 dark:text-amber-300 text-sm">{record.tripName || 'ทริปไม่มีชื่อ'}</h4>
                          <span className="text-[11px] text-slate-500">📅 บันทึกเมื่อ: {record.date}</span>
                        </div>
                        <div className="flex items-center gap-2">
                          <button onClick={() => handleLoadTripForEdit(record)} className="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-semibold flex items-center gap-1"><Icon name="edit-3" className="w-3.5 h-3.5" /> โหลด</button>
                          <button onClick={(e) => handleDeleteHistoryRecord(record.id, e)} className="p-1 text-slate-400 hover:text-rose-500"><Icon name="trash-2" className="w-4 h-4" /></button>
                        </div>
                      </div>
                      <div className="flex items-center justify-between text-xs text-slate-600 dark:text-slate-300">
                        <span>ยอดรวม: <strong className="text-emerald-600 dark:text-emerald-400 font-mono">฿{record.totalAmount?.toLocaleString()}</strong></span>
                        <span className="text-slate-500 dark:text-slate-400">({record.friendsCount || record.friendsData?.length || 0} คน / {record.expensesCount || record.expensesData?.length || 0} รายการ)</span>
                      </div>
                      <details className="text-xs">
                        <summary className="cursor-pointer text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200">ดูสรุปข้อความเดิม</summary>
                        <pre className="mt-2 text-[11px] font-mono bg-slate-100 dark:bg-slate-950 p-2.5 rounded-lg border border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-300 whitespace-pre-wrap">
                          {record.summaryText}
                        </pre>
                      </details>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* Reset Modal */}
          {showResetModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white dark:bg-slate-800 border rounded-2xl max-w-sm w-full p-6 space-y-4">
                <h3 className="text-lg font-bold flex items-center gap-2 text-rose-500 dark:text-rose-400"><Icon name="alert-triangle" className="w-5 h-5" /> ยืนยันการเริ่มทริปใหม่?</h3>
                <p className="text-sm text-slate-600 dark:text-slate-300">ข้อมูลหน้าปัจจุบันจะหายไป (ไม่กระทบประวัติทริปและสมุดรายชื่อเพื่อนที่เซฟแล้ว)</p>
                <div className="flex gap-3 pt-2">
                  <button onClick={() => setShowResetModal(false)} className="flex-1 px-4 py-2 bg-slate-200 dark:bg-slate-700 text-slate-800 dark:text-slate-200 rounded-xl text-sm font-medium hover:bg-slate-300 dark:hover:bg-slate-600">ยกเลิก</button>
                  <button onClick={confirmReset} className="flex-1 px-4 py-2 bg-rose-600 hover:bg-rose-500 text-white rounded-xl text-sm font-medium">เริ่มใหม่</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
