<!DOCTYPE html>
<html lang="th" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบหารค่าใช้จ่ายทริปเพื่อน & บันทึกประวัติ (Cloud)</title>
  
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel CDN for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Firebase SDKs (Compat version for HTML script import) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 dark:bg-slate-900 dark:text-slate-100 font-sans min-h-screen transition-colors duration-200">

  <div id="root"></div>

  <script type="text/babel">
    // ----------------------------------------------------
    // Firebase Configuration
    // ----------------------------------------------------
    const firebaseConfig = {
      apiKey: "AIzaSyCwvoRRmlGk6C-S2PbsZbkm2P5B2E98Hks",
      authDomain: "trip-expense-calculator-9261b.firebaseapp.com",
      projectId: "trip-expense-calculator-9261b",
      storageBucket: "trip-expense-calculator-9261b.firebasestorage.app",
      messagingSenderId: "211000271288",
      appId: "1:211000271288:web:e76cc31d65834a09db6f4d",
      measurementId: "G-N4DE2DLX4W"
    };

    // Initialize Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();
    const storage = firebase.storage ? firebase.storage() : null;

    const { useState, useMemo, useEffect, useRef } = React;

    // Custom Icon Wrapper (ใส่ key={name} ป้องกันไอคอนค้างตอนเปลี่ยนสถานะ)
    const Icon = ({ name, className = "w-4 h-4" }) => {
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [name]);
      return (
        <span key={name} className="inline-flex items-center justify-center shrink-0">
          <i data-lucide={name} className={className}></i>
        </span>
      );
    };

    // รายการค่าใช้จ่ายยอดนิยมสำหรับเลือกด่วน
    const POPULAR_CATEGORIES = [
      { label: "🍲 ค่าอาหาร", title: "ค่าอาหาร" },
      { label: "🍻 ค่าเครื่องดื่ม/เบียร์", title: "ค่าเครื่องดื่ม/เบียร์" },
      { label: "🚗 ค่าน้ำมัน/ค่ารถ", title: "ค่าน้ำมัน/ค่าเดินทาง" },
      { label: "🏨 ค่าที่พัก/โรงแรม", title: "ค่าที่พัก" },
      { label: "☕ ค่าคาเฟ่/ของว่าง", title: "ค่ากาแฟ/ขนม" },
      { label: "🎫 ค่าบัตร/ค่าเข้าชม", title: "ค่าตั๋ว/กิจกรรม" },
      { label: "🛒 ของใช้ส่วนกลาง", title: "ของใช้ส่วนกลาง" }
    ];

    const getTodayDateString = () => {
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    };

    // ฟังก์ชันย่อขนาดและบีบอัดรูปภาพ (ช่วยให้บันทึกใบเสร็จได้รวดเร็วและไม่ง้อ Storage)
    const compressImageFile = (file, maxWidth = 900, quality = 0.65) => {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = (err) => reject(err);
        };
        reader.onerror = (err) => reject(err);
      });
    };

    function App() {
      // Theme State (โหมดกลางวัน / กลางคืน)
      const [isDarkMode, setIsDarkMode] = useState(() => {
        const savedTheme = localStorage.getItem('trip_theme');
        return savedTheme ? savedTheme === 'dark' : true;
      });

      useEffect(() => {
        if (isDarkMode) {
          document.documentElement.classList.add('dark');
          localStorage.setItem('trip_theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          localStorage.setItem('trip_theme', 'light');
        }
      }, [isDarkMode]);

      // User Auth State
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);

      // Current Trip Meta
      const getDefaultTripName = () => {
        const today = new Date();
        return `ทริปวันที่ ${today.toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' })}`;
      };

      const [currentTripId, setCurrentTripId] = useState(null);
      const [tripName, setTripName] = useState(getDefaultTripName());

      // Data States
      const [friends, setFriends] = useState([]);
      const [expenses, setExpenses] = useState([]);
      const [history, setHistory] = useState([]);

      // Inputs state: Friends
      const [newFriendName, setNewFriendName] = useState('');
      const [newFriendPromptPay, setNewFriendPromptPay] = useState('');
      const [newFriendHeadcount, setNewFriendHeadcount] = useState(1);

      // Inputs state: Expenses & Edit Mode
      const [editingExpenseId, setEditingExpenseId] = useState(null);
      const [expenseDate, setExpenseDate] = useState(getTodayDateString());
      const [expenseTitle, setExpenseTitle] = useState('');
      const [expenseAmount, setExpenseAmount] = useState('');
      const [expensePayerId, setExpensePayerId] = useState('');
      const [selectedParticipants, setSelectedParticipants] = useState([]);
      
      // Receipt States
      const [receiptFile, setReceiptFile] = useState(null);
      const [receiptPreview, setReceiptPreview] = useState(null);
      const [uploading, setUploading] = useState(false);
      const [viewingReceiptUrl, setViewingReceiptUrl] = useState(null);
      const fileInputRef = useRef(null);
      const expenseSectionRef = useRef(null);
      
      // UI Modals & Feedback
      const [copied, setCopied] = useState(false);
      const [showResetModal, setShowResetModal] = useState(false);
      const [showHistoryModal, setShowHistoryModal] = useState(false);
      const [saving, setSaving] = useState(false);
      const [alertMsg, setAlertMsg] = useState(null);

      const showAlert = (message, type = 'info') => {
        setAlertMsg({ message, type });
        setTimeout(() => setAlertMsg(null), 4000);
      };

      // ติดตามสถานะ Login และโหลดประวัติ
      useEffect(() => {
        let unsubscribeHistory = null;

        const unsubscribeAuth = auth.onAuthStateChanged((currentUser) => {
          setUser(currentUser);
          setLoading(false);

          if (unsubscribeHistory) {
            unsubscribeHistory();
            unsubscribeHistory = null;
          }

          if (currentUser) {
            const historyRef = db.collection("users").doc(currentUser.uid).collection("trips");
            unsubscribeHistory = historyRef.orderBy("createdAt", "desc").onSnapshot((snapshot) => {
              const tripsData = snapshot.docs.map(doc => ({
                id: doc.id,
                ...doc.data()
              }));
              setHistory(tripsData);
            }, (error) => {
              if (auth.currentUser) {
                console.error("Firestore error:", error);
                showAlert("ไม่สามารถดึงข้อมูลประวัติได้ กรุณาตรวจ Firestore Rules", "error");
              }
            });
          } else {
            setHistory([]);
          }
        });

        return () => {
          if (unsubscribeHistory) unsubscribeHistory();
          unsubscribeAuth();
        };
      }, []);

      // Google Sign-In
      const handleGoogleLogin = async () => {
        const provider = new firebase.auth.GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        try {
          await auth.signInWithPopup(provider);
          showAlert("เข้าสู่ระบบสำเร็จ!", "success");
        } catch (error) {
          console.error("Google Auth Error:", error);
          if (error.code === 'auth/popup-blocked') {
            showAlert("เบราว์เซอร์บล็อกป๊อปอัป กรุณาอนุญาตป๊อปอัปหรือเปิดใน Google Chrome", "error");
          } else if (error.code === 'auth/unauthorized-domain') {
            showAlert("โดเมนนี้ยังไม่ได้รับอนุญาตใน Firebase Console > Authentication > Settings", "error");
          } else {
            showAlert(`เข้าสู่ระบบไม่สำเร็จ: ${error.message}`, "error");
          }
        }
      };

      // Logout
      const handleLogout = async () => {
        try {
          await auth.signOut();
          showAlert("ออกจากระบบเรียบร้อยแล้ว", "info");
        } catch (err) {
          showAlert("ออกจากระบบไม่สำเร็จ: " + err.message, "error");
        }
      };

      // ตั้งค่าคนจ่ายเงินเริ่มต้นเมื่อมีรายชื่อเพื่อน
      useEffect(() => {
        if ((!expensePayerId || !friends.some(f => f.id === expensePayerId)) && friends.length > 0) {
          setExpensePayerId(friends[0].id);
        } else if (friends.length === 0) {
          setExpensePayerId('');
        }
      }, [friends, expensePayerId]);

      // เพิ่มเพื่อนใหม่
      const handleAddFriend = (e) => {
        e.preventDefault();
        if (!newFriendName.trim()) return;

        const newFriend = {
          id: 'friend_' + Date.now().toString(),
          name: newFriendName.trim(),
          promptPay: newFriendPromptPay.trim(),
          headcount: Math.max(1, parseInt(newFriendHeadcount) || 1),
        };

        setFriends(prev => [...prev, newFriend]);
        if (!editingExpenseId) {
          setSelectedParticipants(prev => [...prev, newFriend.id]);
        }
        if (!expensePayerId) {
          setExpensePayerId(newFriend.id);
        }

        setNewFriendName('');
        setNewFriendPromptPay('');
        setNewFriendHeadcount(1);
      };

      const handleDeleteFriend = (id) => {
        setFriends(friends.filter(f => f.id !== id));
        setExpenses(expenses.map(exp => ({
          ...exp,
          participantIds: exp.participantIds.filter(pId => pId !== id),
        })).filter(exp => exp.payerId !== id));
        setSelectedParticipants(selectedParticipants.filter(pId => pId !== id));
      };

      const handleUpdateHeadcount = (id, delta) => {
        setFriends(friends.map(f => {
          if (f.id === id) {
            return { ...f, headcount: Math.max(1, f.headcount + delta) };
          }
          return f;
        }));
      };

      const handleToggleParticipant = (friendId) => {
        setSelectedParticipants(prev =>
          prev.includes(friendId)
            ? prev.filter(id => id !== friendId)
            : [...prev, friendId]
        );
      };

      const handleSelectAllParticipants = () => {
        if (selectedParticipants.length === friends.length) {
          setSelectedParticipants([]);
        } else {
          setSelectedParticipants(friends.map(f => f.id));
        }
      };

      // เมื่อผู้ใช้เลือกไฟล์ใบเสร็จ ให้บีบอัดและสร้าง Preview ทันที
      const handleReceiptFileChange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        if (!file.type.startsWith('image/')) {
          showAlert("กรุณาเลือกไฟล์รูปภาพเท่านั้น", "error");
          return;
        }

        try {
          setReceiptFile(file);
          const compressedDataUrl = await compressImageFile(file);
          setReceiptPreview(compressedDataUrl);
        } catch (err) {
          console.error("Image processing error:", err);
          showAlert("ไม่สามารถอ่านไฟล์รูปภาพนี้ได้", "error");
        }
      };

      // ลบรูปใบเสร็จออกจากฟอร์มกำลังบันทึก/แก้ไข
      const handleClearReceipt = () => {
        setReceiptFile(null);
        setReceiptPreview(null);
        if (fileInputRef.current) fileInputRef.current.value = "";
      };

      // เริ่มแก้ไขรายการค่าใช้จ่าย
      const handleStartEditExpense = (exp) => {
        setEditingExpenseId(exp.id);
        setExpenseDate(exp.date || getTodayDateString());
        setExpenseTitle(exp.title);
        setExpenseAmount(exp.amount.toString());
        setExpensePayerId(exp.payerId);
        setSelectedParticipants(exp.participantIds || []);
        setReceiptFile(null);
        setReceiptPreview(exp.receiptUrl || null);
        if (fileInputRef.current) fileInputRef.current.value = "";

        if (expenseSectionRef.current) {
          expenseSectionRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      };

      // ยกเลิกโหมดแก้ไขรายการ
      const handleCancelEditExpense = () => {
        setEditingExpenseId(null);
        setExpenseDate(getTodayDateString());
        setExpenseTitle('');
        setExpenseAmount('');
        if (friends.length > 0) setExpensePayerId(friends[0].id);
        setSelectedParticipants(friends.map(f => f.id));
        handleClearReceipt();
      };

      // บันทึก หรือ อัปเดตรายการค่าใช้จ่าย
      const handleSaveExpenseForm = async (e) => {
        e.preventDefault();
        const numAmount = parseFloat(expenseAmount);
        if (!expenseTitle.trim() || isNaN(numAmount) || numAmount <= 0 || !expensePayerId || selectedParticipants.length === 0) {
          showAlert("กรุณากรอกข้อมูลรายการ จำนวนเงิน และเลือกคนหารให้ครบถ้วน", "error");
          return;
        }

        setUploading(true);
        let finalReceiptUrl = receiptPreview || null;

        // หากมีการเลือกไฟล์ใหม่ และล็อกอินอยู่ จะลองอัปโหลดไปที่ Firebase Storage (มี Timeout 3.5 วินาที ถ้าไม่ผ่านจะใช้ภาพที่บีบอัดไว้แทนทันที)
        if (receiptFile && user && storage) {
          try {
            const fileName = `receipt_${Date.now()}.jpg`;
            const fileRef = storage.ref().child(`receipts/${user.uid}/${fileName}`);
            
            const uploadTask = fileRef.putString(receiptPreview, 'data_url').then(() => fileRef.getDownloadURL());
            const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error("Storage timeout")), 3500));
            
            finalReceiptUrl = await Promise.race([uploadTask, timeoutPromise]);
          } catch (err) {
            // หาก Storage ยังไม่ได้เปิด หรือติด Rules ระบบจะใช้ภาพ Base64 ที่บีบอัดไว้แล้วแทนโดยอัตโนมัติ
            console.warn("ใช้ระบบบันทึกภาพใบเสร็จแบบฝังในรายการโดยตรง:", err.message);
            finalReceiptUrl = receiptPreview;
          }
        }

        if (editingExpenseId) {
          // อัปเดตรายการเดิม
          setExpenses(prev => prev.map(exp => {
            if (exp.id === editingExpenseId) {
              return {
                ...exp,
                date: expenseDate || getTodayDateString(),
                title: expenseTitle.trim(),
                amount: numAmount,
                payerId: expensePayerId,
                participantIds: [...selectedParticipants],
                receiptUrl: finalReceiptUrl
              };
            }
            return exp;
          }));
          showAlert(`แก้ไขรายการ "${expenseTitle.trim()}" เรียบร้อยแล้ว!`, "success");
          setEditingExpenseId(null);
        } else {
          // เพิ่มรายการใหม่
          const newExpense = {
            id: 'exp_' + Date.now().toString(),
            date: expenseDate || getTodayDateString(),
            title: expenseTitle.trim(),
            amount: numAmount,
            payerId: expensePayerId,
            participantIds: [...selectedParticipants],
            receiptUrl: finalReceiptUrl,
            createdAtMs: Date.now()
          };
          setExpenses(prev => [...prev, newExpense]);
          showAlert(`เพิ่มรายการ "${expenseTitle.trim()}" เรียบร้อย!`, "success");
        }

        // รีเซ็ตฟอร์ม
        setExpenseTitle('');
        setExpenseAmount('');
        handleClearReceipt();
        setSelectedParticipants(friends.map(f => f.id));
        setUploading(false);
      };

      const handleDeleteExpense = (id) => {
        if (editingExpenseId === id) {
          handleCancelEditExpense();
        }
        setExpenses(expenses.filter(e => e.id !== id));
      };

      // เรียงลำดับรายการค่าใช้จ่ายตามวันที่ (เก่าไปใหม่)
      const sortedExpenses = useMemo(() => {
        return [...expenses].sort((a, b) => {
          const dateA = a.date || '';
          const dateB = b.date || '';
          if (dateA !== dateB) {
            return dateA.localeCompare(dateB);
          }
          return (a.createdAtMs || 0) - (b.createdAtMs || 0);
        });
      }, [expenses]);

      // คำนวณยอดหาร
      const calculations = useMemo(() => {
        const friendTotals = {};
        friends.forEach(f => {
          friendTotals[f.id] = {
            id: f.id,
            name: f.name,
            promptPay: f.promptPay || '',
            headcount: f.headcount,
            paid: 0,
            shouldPay: 0,
            netBalance: 0,
          };
        });

        let totalExpenseAmount = 0;

        expenses.forEach(exp => {
          totalExpenseAmount += exp.amount;

          if (friendTotals[exp.payerId]) {
            friendTotals[exp.payerId].paid += exp.amount;
          }

          let totalHeadcountForExpense = 0;
          exp.participantIds.forEach(pId => {
            if (friendTotals[pId]) {
              totalHeadcountForExpense += friendTotals[pId].headcount;
            }
          });

          if (totalHeadcountForExpense > 0) {
            const costPerHead = exp.amount / totalHeadcountForExpense;
            exp.participantIds.forEach(pId => {
              if (friendTotals[pId]) {
                friendTotals[pId].shouldPay += costPerHead * friendTotals[pId].headcount;
              }
            });
          }
        });

        Object.values(friendTotals).forEach(f => {
          f.netBalance = f.paid - f.shouldPay;
        });

        const debtors = [];
        const creditors = [];

        Object.values(friendTotals).forEach(f => {
          if (f.netBalance < -0.01) {
            debtors.push({ ...f, amountOwed: Math.abs(f.netBalance) });
          } else if (f.netBalance > 0.01) {
            creditors.push({ ...f, amountToReceive: f.netBalance });
          }
        });

        debtors.sort((a, b) => b.amountOwed - a.amountOwed);
        creditors.sort((a, b) => b.amountToReceive - a.amountToReceive);

        const settlements = [];
        let i = 0, j = 0;

        while (i < debtors.length && j < creditors.length) {
          const debtor = debtors[i];
          const creditor = creditors[j];
          const settlementAmount = Math.min(debtor.amountOwed, creditor.amountToReceive);

          if (settlementAmount > 0.01) {
            settlements.push({
              fromId: debtor.id,
              fromName: debtor.name,
              toId: creditor.id,
              toName: creditor.name,
              toPromptPay: creditor.promptPay,
              amount: settlementAmount,
            });
          }

          debtor.amountOwed -= settlementAmount;
          creditor.amountToReceive -= settlementAmount;

          if (debtor.amountOwed < 0.01) i++;
          if (creditor.amountToReceive < 0.01) j++;
        }

        return {
          friendTotals: Object.values(friendTotals),
          settlements,
          totalExpenseAmount,
        };
      }, [friends, expenses]);

      const formatThaiDate = (dateStr) => {
        if (!dateStr) return 'ไม่ระบุวันที่';
        const parts = dateStr.split('-');
        if (parts.length !== 3) return dateStr;
        const dateObj = new Date(parts[0], parts[1] - 1, parts[2]);
        return dateObj.toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' });
      };

      // สรุปข้อความส่ง LINE
      const generateSummaryText = () => {
        const finalTripName = tripName.trim() || getDefaultTripName();
        let summaryText = `🏕️ *สรุปค่าใช้จ่าย: ${finalTripName}*\n`;
        summaryText += `💰 ยอดรวมทั้งหมด: ${calculations.totalExpenseAmount.toLocaleString()} บาท\n\n`;

        if (sortedExpenses.length > 0) {
          summaryText += `📋 *รายการค่าใช้จ่าย (เรียงตามวันที่):*\n`;
          sortedExpenses.forEach(exp => {
            const payer = friends.find(f => f.id === exp.payerId);
            summaryText += `- [${formatThaiDate(exp.date)}] ${exp.title}: ${exp.amount.toLocaleString()} บ. (${payer ? payer.name : '-'} จ่าย)${exp.receiptUrl ? ` 🧾` : ''}\n`;
          });
          summaryText += `\n`;
        }
        
        summaryText += `👥 *รายละเอียดต่อคน/กลุ่ม:*\n`;
        calculations.friendTotals.forEach(f => {
          summaryText += `- ${f.name} (${f.headcount} คน): จ่ายแล้ว ${f.paid.toLocaleString()} บ. | ค่าใช้จ่ายจริง ${f.shouldPay.toLocaleString('th-TH', { maximumFractionDigits: 2 })} บ.\n`;
        });

        summaryText += `\n💸 *สรุปการเคลียร์ยอด (ใครโอนให้ใคร):*\n`;
        if (calculations.settlements.length === 0) {
          summaryText += `✨ เคลียร์ยอดครบแล้ว ไม่มีใครต้องโอนเพิ่ม!\n`;
        } else {
          calculations.settlements.forEach(s => {
            const ppInfo = s.toPromptPay ? ` (พร้อมเพย์: ${s.toPromptPay})` : '';
            summaryText += `- 👉 ${s.fromName} โอนให้ ${s.toName}${ppInfo} : *${s.amount.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} บาท*\n`;
          });
        }
        return summaryText;
      };

      // บันทึก หรือ แก้ไขทริปใน Cloud Firestore
      const handleSaveToCloud = async (saveAsNew = false) => {
        if (!user) {
          showAlert("กรุณาเข้าสู่ระบบด้วย Google ก่อนบันทึกทริป", "error");
          return;
        }
        if (friends.length === 0 && expenses.length === 0) {
          showAlert("ยังไม่มีข้อมูลเพื่อนหรือค่าใช้จ่ายให้บันทึก", "error");
          return;
        }

        setSaving(true);
        const finalTripName = tripName.trim() || getDefaultTripName();
        const tripData = {
          tripName: finalTripName,
          date: new Date().toLocaleString('th-TH'),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
          totalAmount: calculations.totalExpenseAmount,
          summaryText: generateSummaryText(),
          friendsCount: friends.length,
          expensesCount: expenses.length,
          friendsData: friends,
          expensesData: expenses
        };

        try {
          const userTripsRef = db.collection("users").doc(user.uid).collection("trips");
          
          if (currentTripId && !saveAsNew) {
            await userTripsRef.doc(currentTripId).set(tripData, { merge: true });
            showAlert(`☁️ อัปเดต "${finalTripName}" สำเร็จ!`, "success");
          } else {
            tripData.createdAt = firebase.firestore.FieldValue.serverTimestamp();
            const newDoc = await userTripsRef.add(tripData);
            setCurrentTripId(newDoc.id);
            showAlert(`☁️ บันทึก "${finalTripName}" เป็นทริปใหม่เรียบร้อย!`, "success");
          }
        } catch (err) {
          console.error("Save error:", err);
          showAlert("เกิดข้อผิดพลาดในการบันทึก: " + err.message, "error");
        } finally {
          setSaving(false);
        }
      };

      // โหลดข้อมูลทริปเดิมกลับมาแก้ไข
      const handleLoadTripForEdit = (record) => {
        const loadedFriends = record.friendsData || [];
        setTripName(record.tripName || getDefaultTripName());
        setFriends(loadedFriends);
        setExpenses(record.expensesData || []);
        setSelectedParticipants(loadedFriends.map(f => f.id));
        setEditingExpenseId(null);
        handleClearReceipt();
        setCurrentTripId(record.id);
        setShowHistoryModal(false);
        showAlert(`📥 โหลดข้อมูล "${record.tripName || 'ทริป'}" เพื่อแก้ไขเรียบร้อย`, "info");
      };

      // ลบประวัติ
      const handleDeleteHistoryRecord = async (tripId, e) => {
        e.stopPropagation();
        if (!user) return;
        if (window.confirm("คุณต้องการลบประวัตินี้หรือไม่?")) {
          try {
            await db.collection("users").doc(user.uid).collection("trips").doc(tripId).delete();
            if (currentTripId === tripId) {
              setCurrentTripId(null);
            }
            showAlert("ลบประวัติเรียบร้อยแล้ว", "info");
          } catch (err) {
            showAlert("ไม่สามารถลบได้: " + err.message, "error");
          }
        }
      };

      const handleCopySummary = () => {
        const summaryText = generateSummaryText();
        const textarea = document.createElement("textarea");
        textarea.value = summaryText;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();
        try {
          document.execCommand("copy");
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
          showAlert("คัดลอกสรุปข้อความแล้ว นำไปส่งลง LINE ได้เลย!", "success");
        } catch (err) {
          showAlert("คัดลอกไม่สำเร็จ โปรดลองอีกครั้ง", "error");
        } finally {
          document.body.removeChild(textarea);
        }
      };

      const confirmReset = () => {
        setFriends([]);
        setExpenses([]);
        setSelectedParticipants([]);
        setEditingExpenseId(null);
        handleClearReceipt();
        setCurrentTripId(null);
        setTripName(getDefaultTripName());
        setShowResetModal(false);

      return (
        <div className="min-h-screen pb-20">
          {/* Toast Notification */}
          {alertMsg && (

              alertMsg.type === 'error' ? 'bg-rose-600 border-rose-400 text-white dark:bg-rose-900/90 dark:border-rose-500 dark:text-rose-100' :
              alertMsg.type === 'success' ? 'bg-emerald-600 border-emerald-400 text-white dark:bg-emerald-900/90 dark:border-emerald-500 dark:text-emerald-100' :
              'bg-slate-800 border-slate-600 text-slate-100'
            }`}>
              <Icon name={alertMsg.type === 'error' ? 'alert-circle' : alertMsg.type === 'success' ? 'check-circle' : 'info'} className="w-5 h-5" />
              <span>{alertMsg.message}</span>
            </div>

          {/* Header */}
          <header className="bg-white/95 dark:bg-slate-800/95 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-40 backdrop-blur-md transition-colors">
            <div className="max-w-5xl mx-auto px-4 py-3.5 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="p-2.5 bg-emerald-500/15 text-emerald-600 dark:bg-emerald-500/20 dark:text-emerald-400 rounded-xl border border-emerald-500/30">
                  <Icon name="pie-chart" className="w-6 h-6" />
                </div>
                <div>
                  <h1 className="text-xl font-bold bg-gradient-to-r from-emerald-600 to-teal-500 dark:from-emerald-400 dark:to-teal-300 bg-clip-text text-transparent flex items-center gap-2">
                    หารค่าใช้จ่ายทริป
                    {currentTripId && (
                      <span className="text-[10px] bg-amber-500/20 text-amber-700 dark:text-amber-300 border border-amber-500/40 px-2 py-0.5 rounded-full font-normal">

                  </h1>
                  <p className="text-xs text-slate-500 dark:text-slate-400">คำนวณง่าย หารแฟร์ แนบใบเสร็จ & แก้ไขได้ตลอดเวลา</p>
                </div>
              </div>

              {/* Theme Toggle, Login & Actions */}

                  <Icon name="rotate-ccw" className="w-4 h-4" />

                    วันที่วันนี้

                </div>

              {currentTripId && (

            {/* Step 1: Manage Friends */}

                  <div className="w-7 h-7 rounded-lg bg-indigo-500/15 dark:bg-indigo-500/20 text-indigo-600 dark:text-indigo-400 flex items-center justify-center font-bold text-sm">1</div>

                    <Icon name="users" className="w-5 h-5 text-indigo-500 dark:text-indigo-400" /> รายชื่อเพื่อน & พร้อมเพย์รับเงิน
                  </h2>
                </div>
                <span className="text-xs bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 px-2.5 py-1 rounded-full font-medium">

                  />
                </div>
                <div className="sm:col-span-3">
                  <input

                    placeholder="เบอร์พร้อมเพย์ / เลขบัญชี (ถ้ามี)"

                  <button type="button" onClick={() => setNewFriendHeadcount(Math.max(1, newFriendHeadcount - 1))} className="w-7 h-7 rounded-lg bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 flex items-center justify-center font-bold text-sm hover:bg-slate-300 dark:hover:bg-slate-700">-</button>
                  <span className="flex-1 text-center font-semibold text-sm text-indigo-600 dark:text-indigo-300">{newFriendHeadcount} คน</span>

              {friends.length === 0 ? (

                      </button>

                              : 'bg-slate-100 dark:bg-slate-900/50 border-slate-300 dark:border-slate-700 text-slate-400 dark:text-slate-500'

                          <span>{friend.name}</span>

                              <Icon name="trash-2" className="w-4 h-4" />

                            {f.netBalance > 0.01 ? `+รับคืน ${f.netBalance.toLocaleString('th-TH', { maximumFractionDigits: 1 })}` : f.netBalance < -0.01 ? `ต้องจ่าย ${Math.abs(f.netBalance).toLocaleString('th-TH', { maximumFractionDigits: 1 })}` : 'สมดุล (0)'}

            >

                className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl max-w-lg w-full p-4 space-y-3 shadow-2xl"

              >

                  <h3 className="text-sm font-bold flex items-center gap-2">
                    <Icon name="image" className="w-4 h-4 text-emerald-500" /> รูปใบเสร็จ / สลิป

                  <button onClick={() => setViewingReceiptUrl(null)} className="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-sm px-2">✕</button>

                <div className="flex justify-end gap-2">
                  <a 
                    href={viewingReceiptUrl}

                  <button 
                    onClick={() => setViewingReceiptUrl(null)} 
                    className="px-4 py-1.5 bg-slate-200 dark:bg-slate-700 text-slate-800 dark:text-slate-200 rounded-xl text-xs font-semibold"
                  >

                </div>
              </div>

                <div className="flex items-center justify-between border-b border-slate-200 dark:border-slate-700 pb-3">

                    <h3 className="text-lg font-bold text-slate-800 dark:text-slate-100 flex items-center gap-2">
                      <Icon name="folder-clock" className="w-5 h-5 text-amber-500 dark:text-amber-400" /> ประวัติทริปบน Cloud
                    </h3>
                    <p className="text-xs text-slate-500 dark:text-slate-400">เลือกทริปที่ต้องการเพื่อโหลดกลับมาดูหรือแก้ไขเพิ่มเติม</p>

                            <button 
                              onClick={() => handleLoadTripForEdit(record)}

                          <span className="text-slate-500 dark:text-slate-400">({record.friendsCount || record.friendsData?.length || 0} คน / {record.expensesCount || record.expensesData?.length || 0} รายการ)</span>
                        </div>

                        <details className="text-xs">
                          <summary className="cursor-pointer text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200">ดูสรุปข้อความเดิม</summary>
                          <pre className="mt-2 text-[11px] font-mono bg-slate-100 dark:bg-slate-950 p-2.5 rounded-lg border border-slate-200 dark:border-slate-800 text-slate-700 dark:text-slate-300 whitespace-pre-wrap">
                            {record.summaryText}
                          </pre>
                        </details>
                      </div>
                    ))
                  )}
                </div>

                <button onClick={() => setShowHistoryModal(false)} className="w-full py-2.5 bg-slate-200 hover:bg-slate-300 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-800 dark:text-slate-200 rounded-xl text-xs font-semibold">
                  ปิดหน้าต่าง
                </button>
              </div>
            </div>
          )}

          {/* Reset Confirmation Modal */}
          {showResetModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-2xl max-w-sm w-full p-6 space-y-4 shadow-2xl">
                <h3 className="text-lg font-bold flex items-center gap-2 text-rose-500 dark:text-rose-400">
                  <Icon name="alert-triangle" className="w-5 h-5" /> ยืนยันการเริ่มทริปใหม่?
                </h3>
                <p className="text-sm text-slate-600 dark:text-slate-300">
                  ข้อมูลเพื่อนและค่าใช้จ่ายในหน้าปัจจุบันจะถูกเคลียร์ออกทั้งหมด (ไม่มีผลกระทบต่อประวัติที่เคยเซฟไว้ใน Cloud)
                </p>
                <div className="flex gap-3 pt-2">
                  <button onClick={() => setShowResetModal(false)} className="flex-1 px-4 py-2 bg-slate-200 dark:bg-slate-700 text-slate-800 dark:text-slate-200 rounded-xl text-sm font-medium hover:bg-slate-300 dark:hover:bg-slate-600">
                    ยกเลิก
                  </button>
                  <button onClick={confirmReset} className="flex-1 px-4 py-2 bg-rose-600 hover:bg-rose-500 text-white rounded-xl text-sm font-medium">
                    เริ่มใหม่
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
