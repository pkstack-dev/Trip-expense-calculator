<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบหารค่าใช้จ่ายทริปเพื่อน & บันทึกประวัติ (Cloud)</title>
  
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel CDN for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Firebase SDKs (Compat version for HTML script import) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    // ----------------------------------------------------
    // Firebase Configuration
    // ----------------------------------------------------
    const firebaseConfig = {
      apiKey: "AIzaSyCwvoRRmlGk6C-S2PbsZbkm2P5B2E98Hks",
      authDomain: "trip-expense-calculator-9261b.firebaseapp.com",
      projectId: "trip-expense-calculator-9261b",
      storageBucket: "trip-expense-calculator-9261b.firebasestorage.app",
      messagingSenderId: "211000271288",
      appId: "1:211000271288:web:e76cc31d65834a09db6f4d",
      measurementId: "G-N4DE2DLX4W"
    };

    // Initialize Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const db = firebase.firestore();

    const { useState, useMemo, useEffect } = React;

    // Custom Icon Wrapper
    const Icon = ({ name, className = "w-4 h-4" }) => {
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [name]);
      return <i data-lucide={name} className={className}></i>;
    };

    // รายการค่าใช้จ่ายยอดนิยมสำหรับเลือกด่วน
    const POPULAR_CATEGORIES = [
      { label: "🍲 ค่าอาหาร", title: "ค่าอาหาร" },
      { label: "🍻 ค่าเครื่องดื่ม/เบียร์", title: "ค่าเครื่องดื่ม/เบียร์" },
      { label: "🚗 ค่าน้ำมัน/ค่ารถ", title: "ค่าน้ำมัน/ค่าเดินทาง" },
      { label: "🏨 ค่าที่พัก/โรงแรม", title: "ค่าที่พัก" },
      { label: "☕ ค่าคาเฟ่/ของว่าง", title: "ค่ากาแฟ/ขนม" },
      { label: "🎫 ค่าบัตร/ค่าเข้าชม", title: "ค่าตั๋ว/กิจกรรม" },
      { label: "🛒 ของใช้ส่วนกลาง", title: "ของใช้ส่วนกลาง" }
    ];

    function App() {
      // User Auth State
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);

      // Current Trip Meta
      const getDefaultTripName = () => {
        const today = new Date();
        return `ทริปวันที่ ${today.toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' })}`;
      };

      const [currentTripId, setCurrentTripId] = useState(null); // หากโหลดทริปเดิมมาแก้
      const [tripName, setTripName] = useState(getDefaultTripName());

      // Data States
      const [friends, setFriends] = useState([]);
      const [expenses, setExpenses] = useState([]);
      const [history, setHistory] = useState([]);

      // Inputs state
      const [newFriendName, setNewFriendName] = useState('');
      const [newFriendHeadcount, setNewFriendHeadcount] = useState(1);
      const [expenseTitle, setExpenseTitle] = useState('');
      const [expenseAmount, setExpenseAmount] = useState('');
      const [expensePayerId, setExpensePayerId] = useState('');
      const [selectedParticipants, setSelectedParticipants] = useState([]);
      
      // UI Modals & Feedback
      const [copied, setCopied] = useState(false);
      const [showResetModal, setShowResetModal] = useState(false);
      const [showHistoryModal, setShowHistoryModal] = useState(false);
      const [saving, setSaving] = useState(false);
      const [alertMsg, setAlertMsg] = useState(null);

      const showAlert = (message, type = 'info') => {
        setAlertMsg({ message, type });
        setTimeout(() => setAlertMsg(null), 4000);
      };

      // ----------------------------------------------------
      // ติดตามสถานะ Login และโหลดประวัติ
      // ----------------------------------------------------
      useEffect(() => {
        const unsubscribe = auth.onAuthStateChanged((currentUser) => {
          setUser(currentUser);
          setLoading(false);

          if (currentUser) {
            const historyRef = db.collection("users").doc(currentUser.uid).collection("trips");
            historyRef.orderBy("createdAt", "desc").onSnapshot((snapshot) => {
              const tripsData = snapshot.docs.map(doc => ({
                id: doc.id,
                ...doc.data()
              }));
              setHistory(tripsData);
            }, (error) => {
              console.error("Firestore error:", error);
              showAlert("ไม่สามารถดึงข้อมูลประวัติได้ กรุณาตรวจ Firestore Rules", "error");
            });
          } else {
            setHistory([]);
          }
        });

        return () => unsubscribe();
      }, []);

      // Google Sign-In with robust error handling
      const handleGoogleLogin = async () => {
        const provider = new firebase.auth.GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        try {
          await auth.signInWithPopup(provider);
          showAlert("เข้าสู่ระบบสำเร็จ!", "success");
        } catch (error) {
          console.error("Google Auth Error:", error);
          if (error.code === 'auth/popup-blocked') {
            showAlert("เบราว์เซอร์บล็อกป๊อปอัป กรุณาอนุญาตป๊อปอัปหรือเปิดใน Google Chrome", "error");
          } else if (error.code === 'auth/unauthorized-domain') {
            showAlert("โดเมนนี้ยังไม่ได้รับอนุญาตใน Firebase Console > Authentication > Settings", "error");
          } else {
            showAlert(`เข้าสู่ระบบไม่สำเร็จ: ${error.message}`, "error");
          }
        }
      };

      // Logout
      const handleLogout = () => {
        auth.signOut();
        showAlert("ออกจากระบบเรียบร้อยแล้ว", "info");
      };

      useEffect(() => {
        if (selectedParticipants.length === 0 && friends.length > 0) {
          setSelectedParticipants(friends.map(f => f.id));
        }
        if (!expensePayerId && friends.length > 0) {
          setExpensePayerId(friends[0].id);
        }
      }, [friends]);

      const handleAddFriend = (e) => {
        e.preventDefault();
        if (!newFriendName.trim()) return;

        const newFriend = {
          id: 'friend_' + Date.now().toString(),
          name: newFriendName.trim(),
          headcount: Math.max(1, parseInt(newFriendHeadcount) || 1),
        };

        setFriends([...friends, newFriend]);
        setNewFriendName('');
        setNewFriendHeadcount(1);
        
        if (selectedParticipants.length > 0) {
          setSelectedParticipants([...selectedParticipants, newFriend.id]);
        }
      };

      const handleDeleteFriend = (id) => {
        setFriends(friends.filter(f => f.id !== id));
        setExpenses(expenses.map(exp => ({
          ...exp,
          participantIds: exp.participantIds.filter(pId => pId !== id),
        })).filter(exp => exp.payerId !== id));
        setSelectedParticipants(selectedParticipants.filter(pId => pId !== id));
      };

      const handleUpdateHeadcount = (id, delta) => {
        setFriends(friends.map(f => {
          if (f.id === id) {
            return { ...f, headcount: Math.max(1, f.headcount + delta) };
          }
          return f;
        }));
      };

      const handleToggleParticipant = (friendId) => {
        if (selectedParticipants.includes(friendId)) {
          setSelectedParticipants(selectedParticipants.filter(id => id !== friendId));
        } else {
          setSelectedParticipants([...selectedParticipants, friendId]);
        }
      };

      const handleSelectAllParticipants = () => {
        if (selectedParticipants.length === friends.length) {
          setSelectedParticipants([]);
        } else {
          setSelectedParticipants(friends.map(f => f.id));
        }
      };

      const handleAddExpense = (e) => {
        e.preventDefault();
        const numAmount = parseFloat(expenseAmount);
        if (!expenseTitle.trim() || isNaN(numAmount) || numAmount <= 0 || !expensePayerId || selectedParticipants.length === 0) {
          showAlert("กรุณากรอกข้อมูลรายการและจำนวนเงินให้ถูกต้อง", "error");
          return;
        }

        const newExpense = {
          id: 'exp_' + Date.now().toString(),
          title: expenseTitle.trim(),
          amount: numAmount,
          payerId: expensePayerId,
          participantIds: [...selectedParticipants],
        };

        setExpenses([...expenses, newExpense]);
        setExpenseTitle('');
        setExpenseAmount('');
        setSelectedParticipants(friends.map(f => f.id));
      };

      const handleDeleteExpense = (id) => {
        setExpenses(expenses.filter(e => e.id !== id));
      };

      // คำนวณยอดหาร
      const calculations = useMemo(() => {
        const friendTotals = {};
        friends.forEach(f => {
          friendTotals[f.id] = {
            id: f.id,
            name: f.name,
            headcount: f.headcount,
            paid: 0,
            shouldPay: 0,
            netBalance: 0,
          };
        });

        let totalExpenseAmount = 0;

        expenses.forEach(exp => {
          totalExpenseAmount += exp.amount;

          if (friendTotals[exp.payerId]) {
            friendTotals[exp.payerId].paid += exp.amount;
          }

          let totalHeadcountForExpense = 0;
          exp.participantIds.forEach(pId => {
            if (friendTotals[pId]) {
              totalHeadcountForExpense += friendTotals[pId].headcount;
            }
          });

          if (totalHeadcountForExpense > 0) {
            const costPerHead = exp.amount / totalHeadcountForExpense;
            exp.participantIds.forEach(pId => {
              if (friendTotals[pId]) {
                friendTotals[pId].shouldPay += costPerHead * friendTotals[pId].headcount;
              }
            });
          }
        });

        Object.values(friendTotals).forEach(f => {
          f.netBalance = f.paid - f.shouldPay;
        });

        const debtors = [];
        const creditors = [];

        Object.values(friendTotals).forEach(f => {
          if (f.netBalance < -0.01) {
            debtors.push({ ...f, amountOwed: Math.abs(f.netBalance) });
          } else if (f.netBalance > 0.01) {
            creditors.push({ ...f, amountToReceive: f.netBalance });
          }
        });

        debtors.sort((a, b) => b.amountOwed - a.amountOwed);
        creditors.sort((a, b) => b.amountToReceive - a.amountToReceive);

        const settlements = [];
        let i = 0, j = 0;

        while (i < debtors.length && j < creditors.length) {
          const debtor = debtors[i];
          const creditor = creditors[j];
          const settlementAmount = Math.min(debtor.amountOwed, creditor.amountToReceive);

          if (settlementAmount > 0.01) {
            settlements.push({
              fromId: debtor.id,
              fromName: debtor.name,
              toId: creditor.id,
              toName: creditor.name,
              amount: settlementAmount,
            });
          }

          debtor.amountOwed -= settlementAmount;
          creditor.amountToReceive -= settlementAmount;

          if (debtor.amountOwed < 0.01) i++;
          if (creditor.amountToReceive < 0.01) j++;
        }

        return {
          friendTotals: Object.values(friendTotals),
          settlements,
          totalExpenseAmount,
        };
      }, [friends, expenses]);

      // สรุปข้อความส่ง LINE
      const generateSummaryText = () => {
        const finalTripName = tripName.trim() || getDefaultTripName();
        let summaryText = `🏕️ *สรุปค่าใช้จ่าย: ${finalTripName}*\n`;
        summaryText += `💰 ยอดรวมทั้งหมด: ${calculations.totalExpenseAmount.toLocaleString()} บาท\n\n`;
        
        summaryText += `👥 *รายละเอียดต่อคน/กลุ่ม:*\n`;
        calculations.friendTotals.forEach(f => {
          summaryText += `- ${f.name} (${f.headcount} คน): จ่ายแล้ว ${f.paid.toLocaleString()} บ. | ค่าใช้จ่ายจริง ${f.shouldPay.toLocaleString('th-TH', { maximumFractionDigits: 2 })} บ.\n`;
        });

        summaryText += `\n💸 *สรุปการเคลียร์ยอด (ใครโอนให้ใคร):*\n`;
        if (calculations.settlements.length === 0) {
          summaryText += `✨ เคลียร์ยอดครบแล้ว ไม่มีใครต้องโอนเพิ่ม!\n`;
        } else {
          calculations.settlements.forEach(s => {
            summaryText += `- 👉 ${s.fromName} โอนให้ ${s.toName} : *${s.amount.toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} บาท*\n`;
          });
        }
        return summaryText;
      };

      // ----------------------------------------------------
      // บันทึก หรือ แก้ไขทริปใน Cloud Firestore
      // ----------------------------------------------------
      const handleSaveToCloud = async (saveAsNew = false) => {
        if (!user) {
          showAlert("กรุณาเข้าสู่ระบบด้วย Google ก่อนบันทึกทริป", "error");
          return;
        }
        if (friends.length === 0 && expenses.length === 0) {
          showAlert("ยังไม่มีข้อมูลเพื่อนหรือค่าใช้จ่ายให้บันทึก", "error");
          return;
        }

        setSaving(true);
        const finalTripName = tripName.trim() || getDefaultTripName();
        const tripData = {
          tripName: finalTripName,
          date: new Date().toLocaleString('th-TH'),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
          totalAmount: calculations.totalExpenseAmount,
          summaryText: generateSummaryText(),
          friendsCount: friends.length,
          expensesCount: expenses.length,
          // บันทึก Raw Data สำหรับการดึงมาแก้ไขย้อนหลัง
          friendsData: friends,
          expensesData: expenses
        };

        try {
          const userTripsRef = db.collection("users").doc(user.uid).collection("trips");
          
          if (currentTripId && !saveAsNew) {
            // อัปเดตทริปเดิม
            await userTripsRef.doc(currentTripId).set(tripData, { merge: true });
            showAlert(`☁️ อัปเดต "${finalTripName}" สำเร็จ!`, "success");
          } else {
            // สร้างทริปใหม่
            tripData.createdAt = firebase.firestore.FieldValue.serverTimestamp();
            const newDoc = await userTripsRef.add(tripData);
            setCurrentTripId(newDoc.id);
            showAlert(`☁️ บันทึก "${finalTripName}" เป็นทริปใหม่เรียบร้อย!`, "success");
          }
        } catch (err) {
          console.error("Save error:", err);
          showAlert("เกิดข้อผิดพลาดในการบันทึก: " + err.message, "error");
        } finally {
          setSaving(false);
        }
      };

      // โหลดข้อมูลทริปเดิมกลับมาแก้ไข
      const handleLoadTripForEdit = (record) => {
        setTripName(record.tripName || getDefaultTripName());
        setFriends(record.friendsData || []);
        setExpenses(record.expensesData || []);
        setCurrentTripId(record.id);
        setShowHistoryModal(false);
        showAlert(`📥 โหลดข้อมูล "${record.tripName || 'ทริป'}" เพื่อแก้ไขเรียบร้อย`, "info");
      };

      // ลบประวัติ
      const handleDeleteHistoryRecord = async (tripId, e) => {
        e.stopPropagation();
        if (!user) return;
        if (window.confirm("คุณต้องการลบประวัตินี้หรือไม่?")) {
          try {
            await db.collection("users").doc(user.uid).collection("trips").doc(tripId).delete();
            if (currentTripId === tripId) {
              setCurrentTripId(null);
            }
            showAlert("ลบประวัติเรียบร้อยแล้ว", "info");
          } catch (err) {
            showAlert("ไม่สามารถลบได้: " + err.message, "error");
          }
        }
      };

      const handleCopySummary = () => {
        const summaryText = generateSummaryText();
        const textarea = document.createElement("textarea");
        textarea.value = summaryText;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();
        try {
          document.execCommand("copy");
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
          showAlert("คัดลอกสรุปข้อความแล้ว นำไปส่งลง LINE ได้เลย!", "success");
        } catch (err) {
          showAlert("คัดลอกไม่สำเร็จ โปรดลองอีกครั้ง", "error");
        } finally {
          document.body.removeChild(textarea);
        }
      };

      const confirmReset = () => {
        setFriends([]);
        setExpenses([]);
        setCurrentTripId(null);
        setTripName(getDefaultTripName());
        setShowResetModal(false);
        showAlert("ล้างข้อมูลปัจจุบันเรียบร้อยแล้ว", "info");
      };

      return (
        <div className="min-h-screen pb-20">
          {/* Toast Notification */}
          {alertMsg && (
            <div className={`fixed top-4 right-4 z-50 px-4 py-3 rounded-xl shadow-2xl flex items-center gap-2 text-sm border animate-bounce ${
              alertMsg.type === 'error' ? 'bg-rose-900/90 border-rose-500 text-rose-100' :
              alertMsg.type === 'success' ? 'bg-emerald-900/90 border-emerald-500 text-emerald-100' :
              'bg-slate-800 border-slate-600 text-slate-100'
            }`}>
              <Icon name={alertMsg.type === 'error' ? 'alert-circle' : alertMsg.type === 'success' ? 'check-circle' : 'info'} className="w-5 h-5" />
              <span>{alertMsg.message}</span>
            </div>
          )}

          {/* Header */}
          <header className="bg-slate-800/95 border-b border-slate-700 sticky top-0 z-40 backdrop-blur-md">
            <div className="max-w-5xl mx-auto px-4 py-3.5 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="p-2.5 bg-emerald-500/20 text-emerald-400 rounded-xl border border-emerald-500/30">
                  <Icon name="pie-chart" className="w-6 h-6" />
                </div>
                <div>
                  <h1 className="text-xl font-bold bg-gradient-to-r from-emerald-400 to-teal-300 bg-clip-text text-transparent flex items-center gap-2">
                    หารค่าใช้จ่ายทริป
                    {currentTripId && (
                      <span className="text-[10px] bg-amber-500/20 text-amber-300 border border-amber-500/40 px-2 py-0.5 rounded-full font-normal">
                        โหมดแก้ไขทริป
                      </span>
                    )}
                  </h1>
                  <p className="text-xs text-slate-400">คำนวณง่าย หารแฟร์ เซฟลง Cloud แก้ไขได้ตลอดเวลา</p>
                </div>
              </div>

              {/* Login & Actions */}
              <div className="flex items-center gap-2">
                {loading ? (
                  <span className="text-xs text-slate-400">กำลังโหลด...</span>
                ) : user ? (
                  <div className="flex items-center gap-2">
                    <button 
                      onClick={() => setShowHistoryModal(true)}
                      className="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded-xl transition-all flex items-center gap-1.5 text-xs font-medium border border-slate-600 shadow-sm"
                    >
                      <Icon name="folder-clock" className="w-4 h-4 text-amber-400" />
                      <span>ประวัติทริป ({history.length})</span>
                    </button>
                    <div className="flex items-center gap-1.5 bg-slate-800 border border-slate-700 rounded-xl p-1 pr-2">
                      <img src={user.photoURL || 'https://via.placeholder.com/32'} alt={user.displayName} className="w-6 h-6 rounded-full border border-emerald-400 object-cover" />
                      <button onClick={handleLogout} className="text-xs text-slate-400 hover:text-rose-400" title="ออกจากระบบ">
                        <Icon name="log-out" className="w-3.5 h-3.5" />
                      </button>
                    </div>
                  </div>
                ) : (
                  <button 
                    onClick={handleGoogleLogin}
                    className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold px-3 py-2 rounded-xl flex items-center gap-2 transition-all shadow-lg"
                  >
                    <Icon name="log-in" className="w-4 h-4" /> เข้าสู่ระบบ Google
                  </button>
                )}

                <button 
                  onClick={() => setShowResetModal(true)}
                  className="text-slate-400 hover:text-rose-400 p-2 rounded-xl hover:bg-slate-700/50 transition-colors"
                  title="เริ่มทริปใหม่ / ล้างข้อมูล"
                >
                  <Icon name="rotate-ccw" className="w-4 h-4" />
                </button>
              </div>
            </div>
          </header>

          <main className="max-w-5xl mx-auto px-4 pt-6 space-y-6">
            
            {/* Trip Name Banner */}
            <div className="bg-gradient-to-r from-slate-800 to-slate-800/80 border border-slate-700/80 rounded-2xl p-4 shadow-xl flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
              <div className="flex-1 w-full">
                <label className="block text-xs font-medium text-amber-300 mb-1 flex items-center gap-1.5">
                  <Icon name="map-pin" className="w-3.5 h-3.5" /> ชื่อทริป (หากไม่กรอกจะใช้วันที่อัตโนมัติ)
                </label>
                <div className="flex items-center gap-2">
                  <input
                    type="text"
                    placeholder={getDefaultTripName()}
                    value={tripName}
                    onChange={(e) => setTripName(e.target.value)}
                    className="w-full bg-slate-900 border border-slate-700 focus:border-amber-400 focus:ring-1 focus:ring-amber-400 rounded-xl px-3.5 py-2 text-sm font-semibold text-slate-100 outline-none placeholder-slate-500"
                  />
                  <button
                    type="button"

                <div className="flex gap-3 pt-2">
                  <button onClick={() => setShowResetModal(false)} className="flex-1 px-4 py-2 bg-slate-700 text-slate-200 rounded-xl text-sm font-medium hover:bg-slate-600">
                    ยกเลิก
                  </button>
                  <button onClick={confirmReset} className="flex-1 px-4 py-2 bg-rose-600 hover:bg-rose-500 text-white rounded-xl text-sm font-medium">
                    เริ่มใหม่
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
